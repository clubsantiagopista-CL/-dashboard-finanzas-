<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Transparencia - Club Ciclista Santiago Pista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#2D3561; --orange:#E8572A; --blue:#3B82F6; --bg:#F1F5F9; }
        body { background:var(--bg); font-family:'DM Sans',system-ui,sans-serif; margin:0; }
        .mono { font-family:'JetBrains Mono',monospace; }

        .scr::-webkit-scrollbar { width:5px; height:6px; }
        .scr::-webkit-scrollbar-track { background:transparent; }
        .scr::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:10px; }

        .hm-paid { background:#D1FAE5; color:#065F46; }
        .hm-unpaid { background:#FEE2E2; color:#991B1B; }
        .hm-na { background:#EFF6FF; color:#93C5FD; }
        .hm-future { background:#F8FAFC; color:#E2E8F0; }
        .hm-exc { background:#FEF3C7; color:#92400E; }
        .hm-susp { background:#e2e8f0; color:#475569; }

        .sticky-col { position:sticky; left:0; z-index:5; background:inherit; }
        thead .sticky-col { z-index:15; }

        .bar-ing { background:var(--navy); }
        .bar-egr { background:var(--orange); }
        .bar-cob { background:#FBBF24; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .fin { animation:fadeIn .3s ease-out forwards; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .sp { animation:spin .8s linear infinite; }

        select option { color: #1e293b; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================
// CONFIG & CONSTANTS
// ============================================================
const SRC = {
    socios:   { l:'Socios',    url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTti5wNytfqEQj9SKhGO-01aG9MsAfQhnk1UQjxLBZTGd_UoHW4-mEnBvCtbjUfTvGtXfr-NNhgHvRd/pub?gid=113097392&single=true&output=csv' },
    txs2026:  { l:'2026',      url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTti5wNytfqEQj9SKhGO-01aG9MsAfQhnk1UQjxLBZTGd_UoHW4-mEnBvCtbjUfTvGtXfr-NNhgHvRd/pub?gid=530518501&single=true&output=csv' },
    txs2025:  { l:'2025',      url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTti5wNytfqEQj9SKhGO-01aG9MsAfQhnk1UQjxLBZTGd_UoHW4-mEnBvCtbjUfTvGtXfr-NNhgHvRd/pub?gid=627364486&single=true&output=csv' },
    novedades:{ l:'Novedades', url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTti5wNytfqEQj9SKhGO-01aG9MsAfQhnk1UQjxLBZTGd_UoHW4-mEnBvCtbjUfTvGtXfr-NNhgHvRd/pub?gid=297967474&single=true&output=csv' },
};

const CUOTA_BASE = 17500;
const CORTE_ABS = 2025 * 12 + 1;

const MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MFULL = [{id:'01',n:'Enero'},{id:'02',n:'Febrero'},{id:'03',n:'Marzo'},{id:'04',n:'Abril'},{id:'05',n:'Mayo'},{id:'06',n:'Junio'},{id:'07',n:'Julio'},{id:'08',n:'Agosto'},{id:'09',n:'Septiembre'},{id:'10',n:'Octubre'},{id:'11',n:'Noviembre'},{id:'12',n:'Diciembre'}];

const STOP_WORDS = ["que","del","los","las","por","con","sin","tef","cta","cct","bco","trf","spa","ltda","limitada","pago","cuota","mes","mensualidad","transferencia","abono","de","la","traspaso","aporte","khipu","fintoc","transf","banco","estado"];

const WORD_SPLIT = /[\s_\-\.:;]+/;

const ALIASES = {
    "armijo churkovic": ["armijo jimenez"],
    "calfuleo": ["christian calfuleo","calfuleo ramirez","matias calfuleo","christian alejandro calfuleo"],
};

// ============================================================
// STATE
// ============================================================
const now = new Date();
const state = {
    socios: [],
    txs: [],
    novs: [],
    ls: { socios: null, txs2026: null, txs2025: null, novedades: null },
    dbg: {},
    showDbg: false,
    yf: now.getFullYear().toString(),
    mf: (now.getMonth() + 1).toString().padStart(2, '0'),
    sf: 'TODOS',
    search: '',
    tab: 'heatmap',
};

// ============================================================
// UTILS
// ============================================================
const fmt = v => (!v || v === 0) ? '$0' : new Intl.NumberFormat('es-CL', {style:'currency',currency:'CLP',minimumFractionDigits:0,maximumFractionDigits:0}).format(v);
const fmtK = v => {
    if (v >= 1000000) return (v/1000000).toLocaleString('es-CL',{maximumFractionDigits:1})+'M';
    if (v >= 1000) return (v/1000).toLocaleString('es-CL',{maximumFractionDigits:1})+'K';
    return v.toString();
};

const nk = k => k ? k.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[()\/\\°#¿?¡!]/g,'').replace(/\s+/g,'_').toLowerCase().trim() : '';
const unaccent = s => s ? s.toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase() : '';

const gv = (r,ks) => { for(const k of ks) if(r[k]!==undefined&&r[k]!==null&&r[k].toString().trim()!=='') return r[k].toString().trim(); return ''; };
const nr = raw => { const o={}; for(const k in raw) o[nk(k)]=(raw[k]||'').toString().trim(); return o; };
const cn = v => { if(!v||v==='') return 0; if(typeof v==='number') return Math.abs(v); const s=v.toString().trim(); if(!s||s==='-'||s==='$') return 0; const n=Number(s.split(',')[0].replace(/[^0-9-]/g,'')); return isNaN(n)?0:Math.abs(n); };
const pd = s => {
    if(!s) return {y:'',m:'',d:''};
    const str=s.toString().trim(); let y='',m='',d='';
    if(str.includes('/')){const p=str.split('/');if(p.length>=3){if(p[2].length===4){d=p[0].padStart(2,'0');m=p[1].padStart(2,'0');y=p[2];}else if(p[0].length===4){y=p[0];m=p[1].padStart(2,'0');d=p[2].padStart(2,'0');}}}
    else if(str.includes('-')){const p=str.split('-');if(p.length>=3){if(p[0].length===4){y=p[0];m=p[1].padStart(2,'0');d=p[2].padStart(2,'0');}else if(p[2].length===4){d=p[0].padStart(2,'0');m=p[1].padStart(2,'0');y=p[2];}}}
    return {y,m,d};
};
const absM = (y,m) => parseInt(y)*12+parseInt(m);

const classCat = (c, d) => {
    const u=(c||'').toUpperCase();
    const desc=(d||'').toUpperCase();
    if(desc.includes('TRICOTA')||desc.includes('INDUMENTARIA')||desc.includes('LICENCIA')||desc.includes('ROPA')||desc.includes('CALZA')||desc.includes('INSCRIPCION')||desc.includes('SEGURO')||desc.includes('EVENTO')) return 'OTROS';
    if(u.includes('TRICOTA')||u.includes('INDUMENTARIA')||u.includes('LICENCIA')||u.includes('ROPA')||u.includes('CALZA')||u.includes('INSCRIPCION')||u.includes('SEGURO')||u.includes('EVENTO')) return 'OTROS';
    if(u.includes('CUOTA')||u.includes('MENSUALIDAD')) return 'CUOTA';
    if(u.includes('ARRIENDO')||u.includes('VELO')||u.includes('PISTA')) return 'ARRIENDO';
    if(u.includes('DONACION')||u.includes('DONACIÓN')) return 'DONACION';
    return 'OTROS';
};

const PXS = [u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];
const pTxt = t => new Promise((res,rej)=>{Papa.parse(t,{header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim(),complete:x=>res({data:x.data,h:x.meta?.fields||[]}),error:e=>rej(e)});});
const loadCSV = async url => {
    try {
        const r = await new Promise((res,rej)=>{Papa.parse(url,{download:true,header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim(),complete:x=>res({data:x.data,h:x.meta?.fields||[]}),error:e=>rej(e)});});
        if(r.data.length>0) return r;
    } catch(e) { console.warn('[D]',e); }
    for(let i=0;i<PXS.length;i++){
        try {
            const rsp=await fetch(PXS[i](url));
            if(!rsp.ok) throw new Error(`${rsp.status}`);
            return await pTxt(await rsp.text());
        } catch(e) { console.warn(`[P${i+1}]`,e); }
    }
    throw new Error('Load failed');
};

const pCart = (data,anio,f) => data.map(raw => {
    const r=nr(raw),
          fecha=gv(r,['fecha','date']),
          desc=gv(r,['descripcion','detalle','glosa']),
          cat=gv(r,['categoria','clasificacion','cat']),
          socioId=gv(r,['socioid','id_socio','socio_id','rut_socio','rut','nombre','socio','alumno']);
    let cs,as;
    if(f==='2026'){cs=gv(r,['cheques__cargos','cheques_cargos','cargos','cargo','cheques']);as=gv(r,['depositos__abonos','depositos_abonos','abonos','abono','depositos']);}
    else{cs=gv(r,['cargos_clp','cargos','cargo']);as=gv(r,['abonos_clp','abonos','abono']);}
    const c=cn(cs),a=cn(as); let tipo='',monto=0;
    if(a>0){tipo='INGRESO';monto=a;}else if(c>0){tipo='EGRESO';monto=c;}else return null;
    const di=pd(fecha);
    return {fecha,desc,tipo,monto,sub:tipo==='INGRESO'?classCat(cat,desc):'EGRESO',cat:cat||'Sin Categoría',y:di.y||anio,m:di.m,d:di.d,sk:`${di.y||anio}-${di.m}-${di.d}`,socioId};
}).filter(Boolean);

// ============================================================
// CACHE
// ============================================================
const curAbs = absM(now.getFullYear(), now.getMonth()+1);
const isLastWeek = now.getDate() >= 24;

const allColumns = (() => {
    const cols = [];
    const maxAbs = absM(Math.max(now.getFullYear(), 2026), 12);
    for(let a=CORTE_ABS; a<=maxAbs; a++){
        const y=Math.floor((a-1)/12); const m=((a-1)%12)+1;
        cols.push({abs:a, y:y.toString(), m:m.toString().padStart(2,'0'), label:`${MS[m-1]}'${y.toString().slice(2)}`, yearNum:y, monthNum:m});
    }
    return cols;
})();

const colByAbs = new Map(allColumns.map(c=>[c.abs, c]));

const cache = {
    ready: false,
    heatDataFull: [],
    getOptimoForMonth: null,
    chartData4Months: [],
    maxBar: 1,
};

function rebuildCache() {
    const getFactorNovedad = (socio, mesAbs) => {
        const matching = state.novs.filter(n => {
            if(socio.rut&&n.rut){
                const r1=socio.rut.replace(/[^0-9kK]/gi,'').toLowerCase();
                const r2=n.rut.replace(/[^0-9kK]/gi,'').toLowerCase();
                if(r1===r2||(r1.length>=7&&r2.length>=7&&r1.slice(0,-1)===r2.slice(0,-1))){
                    return mesAbs>=n.fiAbs&&mesAbs<=n.ftAbs;
                }
            }
            if(n.nombre&&socio.nombre){
                const p1=unaccent(socio.nombre).split(WORD_SPLIT).filter(p=>p.length>2&&!STOP_WORDS.includes(p));
                const p2=unaccent(n.nombre).split(WORD_SPLIT).filter(p=>p.length>2&&!STOP_WORDS.includes(p));
                const matched=p1.filter(p=>p2.some(q=>p===q||(p.length>=4&&q.length>=4&&(p.startsWith(q)||q.startsWith(p)))));
                const maxLen=Math.max(p1.length,p2.length);
                const cov=maxLen>0?matched.length/maxLen:0;
                if(matched.length>=3||cov>=0.75){return mesAbs>=n.fiAbs&&mesAbs<=n.ftAbs;}
            }
            return false;
        });
        if(matching.length===0) return 1;
        return Math.min(...matching.map(n=>n.factor));
    };

    const wordFreq = {};
    state.socios.forEach(s => {
        unaccent(s.nombre).split(WORD_SPLIT).filter(w=>w.length>2&&!STOP_WORDS.includes(w))
            .forEach(w => { wordFreq[w]=(wordFreq[w]||0)+1; });
    });

    const txCuota = state.txs.filter(t=>parseInt(t.y)>=2025&&t.tipo==='INGRESO'&&t.sub==='CUOTA');

    const txAssignments = new Map();
    txCuota.forEach((tx, i) => {
        const txText = unaccent(`${tx.socioId||''} ${tx.desc||''}`).trim();
        const txCleanNum = txText.replace(/[^0-9kK]/gi,'');
        const txWords = txText.split(WORD_SPLIT).filter(w=>w.length>2&&!STOP_WORDS.includes(w));
        let bestId=null, bestSc=0;
        state.socios.forEach(s=>{
            const socioName = unaccent(s.nombre).trim();
            const rutClean = s.rut ? s.rut.replace(/[^0-9kK]/gi,'').toLowerCase() : '';
            let sc = 0;
            if(rutClean&&rutClean.length>=7){
                const rutBase=rutClean.slice(0,-1);
                if(txCleanNum.includes(rutClean)||(rutBase.length>=7&&txCleanNum.includes(rutBase))) sc=100;
            }
            if(sc===0){
                const isAlias=Object.entries(ALIASES).some(([k,v])=>{
                    if(socioName.includes(k)) return v.some(a=>txText.includes(a));
                    return false;
                });
                if(isAlias) sc=95;
            }
            if(sc===0){
                const nameWords=socioName.split(WORD_SPLIT).filter(w=>w.length>2&&!STOP_WORDS.includes(w));
                if(nameWords.length>0){
                    let wScore=0,matched=0;
                    for(const nw of nameWords){
                        const hit=txWords.some(tw=>nw===tw||(nw.length>=4&&tw.length>=4&&(nw.startsWith(tw)||tw.startsWith(nw))));
                        if(hit){matched++;wScore+=1/(wordFreq[nw]||1);}
                    }
                    if(matched>=2){
                        const cov=matched/nameWords.length;
                        sc=Math.round((cov*45)+(Math.min(wScore/nameWords.length,1)*45));
                    }
                }
            }
            if(sc>bestSc){bestSc=sc;bestId=s.id;}
        });
        if(bestSc>=30) txAssignments.set(i,{sid:bestId,sc:bestSc});
    });

    const pagosBySocio = new Map();
    txCuota.forEach((tx, i) => {
        const a = txAssignments.get(i);
        if(!a) return;
        if(!pagosBySocio.has(a.sid)) pagosBySocio.set(a.sid, []);
        pagosBySocio.get(a.sid).push(tx);
    });

    const getOptimoForMonth = (mesAbs) => {
        let opt=0, count=0;
        state.socios.forEach(s=>{
            if(s.isSuspended&&mesAbs>s.salidaAbs) return;
            const primerMesExigible=Math.max(absM(s.iy,s.im),CORTE_ABS);
            if(mesAbs<primerMesExigible) return;
            const factor=getFactorNovedad(s,mesAbs);
            const c=Math.round(s.cuotaBase*factor);
            opt+=c; if(c>0) count++;
        });
        return {opt,count};
    };
    cache.getOptimoForMonth = getOptimoForMonth;

    cache.heatDataFull = state.socios.map(s => {
        const ingresoAbs=absM(s.iy,s.im);
        const primerMesExigible=Math.max(ingresoAbs,CORTE_ABS);
        const pagos=pagosBySocio.get(s.id)||[];
        const totalPagado=pagos.reduce((a,t)=>a+t.monto,0);
        const monthMap={};
        let exigibleAcum=0;

        for(const col of allColumns){
            const mesAbs=col.abs;
            const isFuture=mesAbs>curAbs;
            if(mesAbs<primerMesExigible){monthMap[mesAbs]={status:'na',label:'—',cuotaMes:0,exigAcum:0};continue;}
            if(s.isSuspended&&mesAbs>s.salidaAbs){monthMap[mesAbs]={status:'susp',label:'S',cuotaMes:0,exigAcum:exigibleAcum};continue;}
            if(isFuture){monthMap[mesAbs]={status:'future',label:'·',cuotaMes:0,exigAcum:exigibleAcum};continue;}

            const factor=getFactorNovedad(s,mesAbs);
            const cuotaMes=Math.round(s.cuotaBase*factor);
            const isCurrentMonth=(mesAbs===curAbs);
            const isRequiredYet=!(isCurrentMonth&&!isLastWeek);
            if(isRequiredYet) exigibleAcum+=cuotaMes;
            const paid=totalPagado>=(isRequiredYet?exigibleAcum:(exigibleAcum+cuotaMes));
            const isException=factor<1;
            let cellStatus='unpaid', cellLabel='✗';
            if(paid){cellStatus='paid';cellLabel='✓';}
            else if(isCurrentMonth&&!isLastWeek){cellStatus='future';cellLabel='·';}
            monthMap[mesAbs]={status:cellStatus,label:cellLabel,cuotaMes,exigAcum:isRequiredYet?exigibleAcum:(exigibleAcum+cuotaMes),isException,factor};
        }

        const deuda=Math.max(0,exigibleAcum-totalPagado);
        const impagos=(deuda>0&&s.cuotaBase>0)?Math.ceil(deuda/s.cuotaBase):0;
        const nombreUA=unaccent(s.nombre);
        return {...s,monthMap,impagos,totalPagado,exigibleAcum,deuda,isActive:!s.isSuspended,nombreUA};
    }).sort((a,b)=>{
        if(b.deuda!==a.deuda) return b.deuda-a.deuda;
        if(b.impagos!==a.impagos) return b.impagos-a.impagos;
        return a.nombre.localeCompare(b.nombre);
    });

    const chartCols=[];
    for(let i=3;i>=0;i--){
        const a=curAbs-i;
        const y=Math.floor((a-1)/12); const m=((a-1)%12)+1;
        chartCols.push({abs:a,y:y.toString(),m:m.toString().padStart(2,'0'),label:`${MS[m-1]}'${y.toString().slice(2)}`});
    }
    cache.chartData4Months=chartCols.map(col=>{
        const mtxs=state.txs.filter(t=>t.y===col.y&&t.m===col.m);
        const ing=mtxs.filter(t=>t.tipo==='INGRESO').reduce((a,b)=>a+b.monto,0);
        const eg=mtxs.filter(t=>t.tipo==='EGRESO').reduce((a,b)=>a+b.monto,0);
        const optimo=getOptimoForMonth(col.abs).opt;
        const ingCuotas=mtxs.filter(t=>t.tipo==='INGRESO'&&t.sub==='CUOTA').reduce((a,b)=>a+b.monto,0);
        return {...col,ing,eg,porCobrar:Math.max(0,optimo-ingCuotas)};
    });
    cache.maxBar=Math.max(...cache.chartData4Months.map(d=>Math.max(d.ing,d.eg,d.porCobrar)),1);
    cache.ready=true;
}

function getFilteredHeat() {
    const searchUA = unaccent(state.search);
    return cache.heatDataFull.filter(s => {
        if(searchUA && !s.nombreUA.includes(searchUA)) return false;
        if(state.sf==='ACTIVO' && s.isSuspended) return false;
        if(state.sf==='SUSPENDIDO' && !s.isSuspended) return false;
        return true;
    });
}

function getFilterDependentValues() {
    const txFilt = state.txs.filter(t => {
        if (parseInt(t.y) < 2025) return false;
        if (state.yf !== 'TODOS' && t.y !== state.yf) return false;
        if (state.mf !== 'TODOS' && t.m !== state.mf) return false;
        return true;
    });
    const kI = txFilt.filter(t=>t.tipo==='INGRESO').reduce((a,b)=>a+b.monto,0);
    const kE = txFilt.filter(t=>t.tipo==='EGRESO').reduce((a,b)=>a+b.monto,0);
    const egresos = txFilt.filter(t=>t.tipo==='EGRESO').sort((a,b)=>(b.sk||'').localeCompare(a.sk||''));

    let colsToSum = allColumns;
    if(state.yf!=='TODOS') colsToSum=colsToSum.filter(c=>c.yearNum===parseInt(state.yf));
    if(state.mf!=='TODOS') colsToSum=colsToSum.filter(c=>c.monthNum===parseInt(state.mf));
    const validCols=colsToSum.filter(col=>col.abs<=curAbs);
    let optiTotal=0, countActivos=0;
    validCols.forEach(col=>{
        const res=cache.getOptimoForMonth(col.abs);
        const isCurrentMonth=(col.abs===curAbs);
        if(!(isCurrentMonth&&!isLastWeek)) optiTotal+=res.opt;
        countActivos+=res.count;
    });
    const promActivos=validCols.length>0?Math.round(countActivos/validCols.length):0;
    const realCuotas=txFilt.filter(t=>t.tipo==='INGRESO'&&t.sub==='CUOTA').reduce((a,b)=>a+b.monto,0);
    const kpiRecaudacion={optimo:optiTotal,real:realCuotas,brecha:Math.max(0,optiTotal-realCuotas),promActivos};

    const targetY = state.yf==='TODOS' ? now.getFullYear() : parseInt(state.yf);
    const cols = allColumns.filter(c=>c.yearNum===targetY);
    let targetAbs;
    if(state.mf!=='TODOS') targetAbs=absM(targetY,parseInt(state.mf));
    else targetAbs=(targetY===now.getFullYear())?curAbs:absM(targetY,12);
    const displayColumns=cols.map(c=>({...c,isRecent3:c.abs<=targetAbs&&c.abs>=targetAbs-2}));

    return {txFilt,kI,kE,egresos,kpiRecaudacion,displayColumns};
}

// ============================================================
// RENDER
// ============================================================
function buildTabContent(displayColumns, heatData, egresos) {
    function buildTable(data, title, colorTheme) {
        const iconName = colorTheme === 'rose' ? 'alert-octagon' : 'grid-3x3';
        const colHeaders = displayColumns.map(c =>
            `<th class="p-2 text-center w-8 sm:w-9 font-mono border-r border-slate-100 ${!c.isRecent3?'hidden md:table-cell':''}">${c.label}</th>`
        ).join('');

        const rows = data.map(s => {
            const monthCells = displayColumns.map(c => {
                const m = s.monthMap[c.abs];
                if(!m) return `<td class="p-1 border-r border-slate-50 text-center ${!c.isRecent3?'hidden md:table-cell':''}"></td>`;
                const cls = m.status==='paid'?'hm-paid':m.status==='unpaid'?'hm-unpaid':m.status==='susp'?'hm-susp':m.status==='future'?'hm-future':m.status==='na'?'hm-na':'hm-exc';
                const exCls = m.isException ? 'hm-exc' : '';
                const borderCls = m.status==='future' ? 'border border-slate-200' : '';
                const titleTxt = m.status==='susp' ? 'Congelado' : `Cuota: ${fmt(m.cuotaMes)} | Exig. Acum: ${fmt(m.exigAcum)}`;
                return `<td class="p-1 border-r border-slate-50 text-center ${!c.isRecent3?'hidden md:table-cell':''}">
                    <div class="w-full h-7 sm:h-8 flex items-center justify-center rounded-md ${exCls||cls} ${borderCls}" title="${titleTxt}">
                        <span class="text-[9px] sm:text-[10px] font-bold">${m.label}</span>
                    </div></td>`;
            }).join('');

            return `<tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                <td class="p-2 sticky-col bg-inherit border-r border-slate-200 font-medium truncate min-w-[120px] max-w-[120px] sm:min-w-[200px] sm:max-w-[200px]" title="${s.nombre}">
                    <div class="flex items-center gap-1.5 justify-between">
                        <span class="truncate text-[10px] sm:text-[11px] leading-tight">${s.nombre}</span>
                        ${s.isSuspended?'<span class="text-[7px] sm:text-[8px] bg-rose-100 text-rose-600 px-1 py-0.5 rounded font-bold">SUSP</span>':''}
                    </div>
                    <div class="text-[8px] sm:text-[9px] text-slate-400 font-normal mt-0.5 truncate">${s.estado}</div>
                </td>
                ${monthCells}
                <td class="p-2 text-center bg-slate-50 border-l border-slate-200 font-mono font-bold text-rose-600 text-[10px] sm:text-xs">
                    ${s.impagos > 0 ? s.impagos : '<span class="text-slate-300">-</span>'}
                </td>
                <td class="p-2 text-right bg-slate-50 font-mono font-bold text-rose-600 text-[10px] sm:text-xs">${fmt(s.deuda)}</td>
            </tr>`;
        }).join('');

        const emptyRow = data.length===0 ? `<tr><td colspan="${displayColumns.length+3}" class="p-4 text-center text-slate-400">No hay socios que coincidan con los filtros.</td></tr>` : '';

        return `<div class="bg-white rounded-xl shadow-sm border border-${colorTheme}-200 mb-6 fin">
            <div class="p-3 border-b border-slate-100 bg-${colorTheme}-50 rounded-t-xl flex flex-wrap items-center justify-between gap-2">
                <div>
                    <h2 class="font-bold text-${colorTheme}-800 text-sm flex items-center gap-2">
                        <i data-lucide="${iconName}" class="w-4 h-4 text-${colorTheme}-600"></i>${title}
                    </h2>
                    <p class="text-[9px] sm:text-[10px] text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-2 sm:gap-x-3 gap-y-1">
                        <span><span class="inline-block w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-sm align-middle hm-paid mr-0.5"></span>Pagado</span>
                        <span><span class="inline-block w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-sm align-middle hm-unpaid mr-0.5"></span>Impago</span>
                        <span><span class="inline-block w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-sm align-middle hm-exc mr-0.5"></span>Excepción</span>
                        <span><span class="inline-block w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-sm align-middle hm-susp mr-0.5"></span>Suspendido</span>
                        <span class="font-bold text-slate-600 sm:ml-2">FIFO</span>
                    </p>
                </div>
                <span class="bg-${colorTheme}-100 text-${colorTheme}-700 text-[10px] font-bold px-2 py-1 rounded-lg">${data.length} socios</span>
            </div>
            <div class="scr overflow-x-auto overflow-y-auto" style="max-height:540px">
                <table class="border-collapse text-left w-full text-xs min-w-max">
                    <thead class="bg-white sticky top-0 z-10 text-[9px] sm:text-[10px] uppercase text-slate-400 font-bold border-b border-slate-200">
                        <tr>
                            <th class="p-2 sticky-col bg-white border-r border-slate-200 shadow-[2px_0_5px_rgba(0,0,0,0.02)] min-w-[120px] max-w-[120px] sm:min-w-[200px] sm:max-w-[200px]">Socio</th>
                            ${colHeaders}
                            <th class="p-2 text-center bg-slate-50 border-l border-slate-200 w-16 sm:w-20 leading-tight">Cuotas Impagas</th>
                            <th class="p-2 text-right bg-slate-50 w-20 sm:w-24">Deuda</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-700">${rows}${emptyRow}</tbody>
                </table>
            </div>
        </div>`;
    }

    if(state.tab === 'heatmap') {
        const heatActive = heatData.filter(s=>!s.isSuspended);
        const heatBlacklist = heatData.filter(s=>s.isSuspended);
        return `<div class="pb-8" id="tab-content">
            ${heatActive.length>0 ? buildTable(heatActive,'Matriz de Socios Activos / Regulares','emerald') : ''}
            ${heatBlacklist.length>0 ? buildTable(heatBlacklist,'Socios Suspendidos / Retirados (Lista Negra)','rose') : ''}
        </div>`;
    }

    const egresoRows = egresos.map(e =>
        `<tr class="border-b border-slate-50">
            <td class="py-2 font-mono text-[10px] text-slate-500">${e.fecha}</td>
            <td class="py-2"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold">${e.cat}</span></td>
            <td class="py-2 text-slate-700 truncate max-w-[200px]" title="${e.desc||''}">${e.desc||''}</td>
            <td class="py-2 text-right font-mono text-rose-600 font-bold">${fmt(e.monto)}</td>
        </tr>`).join('');
    return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 fin" id="tab-content">
        <h2 class="font-bold text-slate-800 text-sm mb-4">Detalle de Egresos</h2>
        ${egresos.length===0 ? '<p class="text-sm text-slate-500">No hay egresos en este periodo.</p>'
            : `<div class="overflow-x-auto scr"><table class="w-full text-left text-xs min-w-[500px]">
                <thead class="text-[10px] text-slate-400 uppercase font-bold border-b border-slate-100">
                    <tr><th class="py-2">Fecha</th><th class="py-2">Categoría</th><th class="py-2">Descripción</th><th class="py-2 text-right">Monto</th></tr>
                </thead>
                <tbody>${egresoRows}</tbody>
            </table></div>`}
    </div>`;
}

function render() {

        ${Object.entries(state.dbg).map(([k,info])=>`<div class="mb-2"><span class="text-sky-400 font-bold">${SRC[k]?.l||k}:</span>${info.error?`<span class="text-rose-400 ml-2">${info.error}</span>`:`<span class="text-slate-500 ml-2">${info.n} filas | [${info.h?.join(', ')}]</span>`}</div>`).join('')}
    </div>` : '';

    root.innerHTML = `
    <div class="min-h-screen">
        <div class="sticky top-0 z-40 border-b" style="background:var(--navy)">

                    <div>
                        <h1 class="text-white font-extrabold text-sm sm:text-base tracking-tight leading-tight">Portal de Transparencia</h1>
                        <p class="text-slate-400 text-[9px] font-medium tracking-wider uppercase">Club Ciclista Santiago Pista</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <select class="bg-white/10 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-white/20 outline-none cursor-pointer" onchange="setState({yf:this.value})">
                        <option value="TODOS" class="text-slate-900" ${state.yf==='TODOS'?'selected':''}>Todos los años</option>
                        <option value="2025" class="text-slate-900" ${state.yf==='2025'?'selected':''}>2025</option>
                        <option value="2026" class="text-slate-900" ${state.yf==='2026'?'selected':''}>2026</option>
                    </select>
                    <select class="bg-white/10 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-white/20 outline-none cursor-pointer" onchange="setState({mf:this.value})">
                        <option value="TODOS" class="text-slate-900" ${state.mf==='TODOS'?'selected':''}>Todos los meses</option>
                        ${monthOptions}
                    </select>
                    <input id="searchInput" type="text" placeholder="Buscar socio..." class="bg-white/10 text-white placeholder-slate-400 text-[11px] px-2.5 py-1.5 rounded-lg border border-white/20 outline-none w-36 sm:w-48 focus:bg-white/20" value="${state.search}" oninput="updateSearch(this.value)" />
                    <select class="bg-white/10 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-white/20 outline-none cursor-pointer" onchange="setState({sf:this.value})">
                        <option value="TODOS" class="text-slate-900" ${state.sf==='TODOS'?'selected':''}>Todos</option>
                        <option value="ACTIVO" class="text-slate-900" ${state.sf==='ACTIVO'?'selected':''}>Activos</option>
                        <option value="SUSPENDIDO" class="text-slate-900" ${state.sf==='SUSPENDIDO'?'selected':''}>Suspendidos/Retirados</option>
                    </select>
                    <button onclick="setState({showDbg:!state.showDbg})" class="bg-white/10 text-slate-400 text-[10px] px-2 py-1 rounded cursor-pointer hover:text-white ml-auto">dbg</button>
                </div>
            </div>
        </div>

        <div class="max-w-[1700px] mx-auto px-2 sm:px-4 py-4">
            ${debugHtml}

            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3 mb-4">
                <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200 fin">
                    <p class="text-[8px] sm:text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-sm inline-block" style="background: var(--navy)"></span>Ingresos</p>
                    <h2 class="text-base sm:text-2xl font-extrabold" style="color: var(--navy)">${fmt(kI)}</h2>
                </div>
                <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200 fin">
                    <p class="text-[8px] sm:text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-sm inline-block" style="background: var(--orange)"></span>Egresos</p>
                    <h2 class="text-base sm:text-2xl font-extrabold" style="color: var(--orange)">${fmt(kE)}</h2>
                </div>
                <div class="p-3 md:p-4 rounded-xl shadow-sm border fin ${balance>=0?'bg-emerald-50 border-emerald-100':'bg-rose-50 border-rose-100'}">
                    <p class="text-[8px] sm:text-[9px] font-bold uppercase tracking-widest mb-1 ${balance>=0?'text-emerald-500':'text-rose-400'}">Caja Efectiva</p>
                    <h2 class="text-base sm:text-2xl font-extrabold ${balance>=0?'text-emerald-600':'text-rose-600'}">${fmt(balance)}</h2>
                </div>
                <div class="bg-amber-50 p-3 md:p-4 rounded-xl shadow-sm border border-amber-100 fin relative overflow-hidden">
                    <p class="text-[8px] sm:text-[9px] font-bold text-amber-600 uppercase tracking-widest mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-sm inline-block bg-amber-400"></span>Por Cobrar</p>

                    <p class="text-[8px] text-amber-700/70 mt-1 font-medium leading-tight">Óptimo: ~${kpiRecaudacion.promActivos} activos (${fmt(kpiRecaudacion.optimo)}) <br/> - Cuotas Reales: ${fmt(kpiRecaudacion.real)}</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 md:p-4 mb-4 fin">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3 gap-2">
                    <div>
                        <h2 class="font-bold text-slate-800 text-sm">Flujo de Caja (Últimos 4 meses)</h2>
                        <p class="text-[9px] sm:text-[10px] text-slate-400">Histórico estático (Independiente de los filtros superiores)</p>
                    </div>
                    <div class="flex items-center gap-2 sm:gap-4 text-[9px] sm:text-[10px] font-bold flex-wrap">
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bar-ing inline-block"></span> Ingresos</span>
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bar-egr inline-block"></span> Egresos</span>
                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bar-cob inline-block"></span> Por Cobrar</span>
                    </div>

                <div class="scr overflow-x-auto w-full pt-8 px-2" style="padding-bottom:4px">
                    <div class="flex items-end justify-between gap-1 sm:gap-2 w-full min-w-[400px] sm:min-w-[500px]" style="height:170px">
                        ${chartData4Months.map(d=>{
                            const maxB = maxBar > 0 ? maxBar : 1;
                            const hI = (d.ing / maxB) * 140;
                            const hE = (d.eg / maxB) * 140;
                            const hC = (d.porCobrar / maxB) * 140;

                            <div class="flex-1 flex flex-col items-center">
                                <div class="flex items-end justify-center gap-[1px] sm:gap-1 w-full" style="height:140px">
                                    <div class="bar-ing rounded-t-sm relative group w-1/3 max-w-[28px] sm:max-w-[40px]" style="height:${Math.max(hI,2)}px">
                                        ${d.ing>0?`<div class="absolute -top-6 left-1/2 -translate-x-1/2 text-slate-600 text-[8px] sm:text-[10px] font-bold whitespace-nowrap z-10">${fmtK(d.ing)}</div>`:''}

            <div class="flex items-center gap-1 mb-3">

                <button onclick="setState({tab:'egresos'})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.tab==='egresos'?'bg-white shadow-sm text-slate-800 border border-slate-200':'text-slate-500 hover:text-slate-700'}">
                    <i data-lucide="arrow-down-right" class="w-3 h-3 inline mr-1"></i> Egresos
                </button>
            </div>

            ${buildTabContent(displayColumns, heatData, egresos)}

    </div>`;
    
    if(window.lucide) lucide.createIcons();
}

let searchTimeout;
function updateSearch(val) {
    state.search = val; 
    clearTimeout(searchTimeout);
    
    searchTimeout = setTimeout(() => {
        render(); 
        const input = document.getElementById('searchInput');
        if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }
    }, 350); 
}

function setState(newState) {
    Object.assign(state, newState);
    render();
}

async function init() {
    render(); 
    try{ const {data,h}=await loadCSV(SRC.socios.url); state.dbg.socios={h,n:data.length};
        state.socios=data.map((raw,i)=>{
            const r=nr(raw);
            const n=gv(r,['nombre_completo','nombre','socio']);
            const rut=gv(r,['rut']);
            let est=(gv(r,['estado_en_el_club','estado','status'])||'ACTIVO').toUpperCase();
            const ts=gv(r,['tipo_socio','tipo']);
            const fi=gv(r,['fecha_de_ingreso','fecha_ingreso','fechaingreso']);
            const fp=pd(fi); let iy=fp.y?parseInt(fp.y):2024; let im=fp.m?parseInt(fp.m):1;
            const fSalida=gv(r,['fecha_act_estado','fecha_de_salida','fecha_salida','fechasalida','baja','retiro']);
            const fpS=pd(fSalida);
            let isSuspended = est.includes('SUSPENDID') || est.includes('DESVINCULAD') || est.includes('RETIRAD') || est.includes('INACTIVO') || est.includes('RENUNCIA');
            let salidaAbs = fpS.y ? absM(fpS.y, fpS.m) : (isSuspended ? absM(now.getFullYear(), now.getMonth()+1) : 99999);

            const nameUp = unaccent(n);
            if (nameUp.includes("matias quezada")) {
                est = "RENUNCIA"; isSuspended = true; iy = 2025; im = 9; salidaAbs = 2025 * 12 + 12;
            }
            return{id:i+1,rut,nombre:n||`S${i+1}`,estado:est,tipo:ts,cuotaBase:CUOTA_BASE,fi,iy,im,isSuspended,salidaAbs};
        }).filter(s=>s.nombre&&s.nombre.length>2);
        state.ls.socios='ok';}catch(e){state.ls.socios=`Err: ${e}`;state.dbg.socios={error:String(e)};}

    try{const{data,h}=await loadCSV(SRC.txs2026.url);state.dbg.txs2026={h,n:data.length};state.txs.push(...pCart(data,'2026','2026'));state.ls.txs2026='ok';}catch(e){state.ls.txs2026=`Err: ${e}`;}
    try{const{data,h}=await loadCSV(SRC.txs2025.url);state.dbg.txs2025={h,n:data.length};state.txs.push(...pCart(data,'2025','2025'));state.ls.txs2025='ok';}catch(e){state.ls.txs2025='ok';}

    try{const{data}=await loadCSV(SRC.novedades.url);
        state.novs=data.map(raw=>{const r=nr(raw);
            const rut=gv(r,['rut']);const nom=gv(r,['nombre_completo','nombre']);
            const tipo=(gv(r,['tipo_de_novedad','tipo_novedad','novedad'])||'').toUpperCase();
            const fiStr=gv(r,['fecha_inicio']);const ftStr=gv(r,['fecha_termino','fecha_fin']);
            const fi=pd(fiStr);const ft=pd(ftStr);
            let factor=0;
            if(tipo.includes('CONGELA')||tipo.includes('MONTO 0')||tipo.includes('MONTO_0')) factor=0;
            else if(tipo.includes('BECA 50')||tipo.includes('50%')||tipo.includes('BECA_50')) factor=0.5;
            else if(tipo.includes('BECA')) factor=0;
            return{rut,nombre:nom,tipo,factor,fiAbs:fi.y?absM(fi.y,fi.m):0,ftAbs:ft.y?absM(ft.y,ft.m):99999,fiStr,ftStr};
        }).filter(n=>n.rut||n.nombre);
        state.ls.novedades='ok';}catch(e){state.ls.novedades=`Err: ${e}`;}

    rebuildCache();
    render();
}

init();
</script>
