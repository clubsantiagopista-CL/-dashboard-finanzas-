<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transparencia y Metas · Club Ciclista Santiago Pista</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1e293b; --orange:#E8572A; --green:#22c55e; --red:#ef4444; --bg:#F1F5F9; }
  body { background:var(--bg); font-family:'DM Sans',system-ui,sans-serif; margin:0; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:.9rem; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  @keyframes spin { to { transform:rotate(360deg) } } .sp { animation:spin .8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================
// Página pública de transparencia (sin login).
// Solo consume la función resumen_publico(): cifras agregadas del club,
// metas y auspiciadores visibles. No accede a datos individuales de socios.
// ============================================================
const CONFIG = {
    SUPABASE_URL: 'https://xnbrkusnmascgkhumyab.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_Z--e4miwXSirAa7cj87I3A_ZDOwOOgn',
};
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const NIVELES = { SPONSOR_OFICIAL: 'Sponsor Oficial', PARTNER: 'Partner', COLABORADOR: 'Colaborador' };
const state = { anio: Math.max(2026, new Date().getFullYear()), data: null, error: '' };

const fmt = v => new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(v || 0);
const fmtK = v => v >= 1e6 ? '$' + (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits:1 }) + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'K' : '$' + v;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

// Misma lógica que admin.html: las metas se cubren en orden de prioridad ("llenado de vaso")
function objetivoMeta(m) { const v = Number(m.monto_objetivo); return m.periodicidad === 'MENSUAL' ? v * 12 : v; }
function cascadaMetas(metas, recaudado) {
    let resto = recaudado, acum = 0;
    return metas.map(m => {
        const objetivo = Math.round(objetivoMeta(m));
        const cubierto = Math.max(0, Math.min(objetivo, resto)); resto -= cubierto;
        const inicio = acum; acum += objetivo;
        const unidades = m.equivalencia_costo ? Math.floor(cubierto / Number(m.equivalencia_costo)) : null;
        return { ...m, objetivo, cubierto, falta: objetivo - cubierto, pct: objetivo ? cubierto / objetivo : 0, inicio, fin: acum, unidades };
    });
}
function donut(parts) {
    const total = parts.reduce((a, p) => a + p.v, 0), r = 54, c = 2 * Math.PI * r; let off = 0;
    if (!total) return '<p class="text-xs text-slate-400">Sin datos</p>';
    const arcs = parts.filter(p => p.v > 0).map(p => { const len = c * p.v / total; const s = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(p.l)}: ${fmt(p.v)}</title></circle>`; off += len; return s; }).join('');
    return `<svg width="150" height="150" viewBox="0 0 150 150">${arcs}<text x="75" y="72" text-anchor="middle" font-size="10" fill="#64748b">Total</text><text x="75" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b">${fmtK(total)}</text></svg>`;
}
// Plural de la primera palabra: 'hora de entrenamiento' -> 'horas de entrenamiento'
const pluralUnidad = (u, n) => { u = u || 'unidad'; if (n === 1) return u; const [p, ...r] = u.split(' '); return [p + (/[aeiouáéíóú]$/i.test(p) ? 's' : 'es'), ...r].join(' '); };
const PALETA = ['#1e293b', '#22c55e', '#E8572A', '#3b82f6', '#a855f7', '#f59e0b', '#14b8a6', '#94a3b8'];

async function cargar() {
    state.data = null; state.error = ''; render();
    const { data, error } = await sb.rpc('resumen_publico', { p_anio: state.anio });
    if (error) state.error = error.message; else state.data = data;
    render();
}

function render() {
    const root = document.getElementById('root');
    const header = `<header style="background:var(--navy)"><div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-lg flex items-center justify-center font-black text-white" style="background:var(--orange)">SP</div>
          <div><h1 class="text-white font-extrabold leading-tight">Transparencia y Metas</h1><p class="text-slate-400 text-[10px] uppercase tracking-wider">Club Ciclista Santiago Pista</p></div></div>
        <select class="bg-white/10 text-white text-xs font-bold px-3 py-2 rounded-lg border border-white/20" onchange="state.anio=parseInt(this.value);cargar()">
          ${[...new Set([2026, new Date().getFullYear()])].map(y => `<option class="text-slate-900" ${y === state.anio ? 'selected' : ''}>${y}</option>`).join('')}</select>
      </div></header>`;
    if (state.error) { root.innerHTML = header + `<div class="max-w-6xl mx-auto p-6"><div class="card p-6 text-sm text-rose-600">No se pudo cargar la información (${esc(state.error)}).</div></div>`; return; }
    if (!state.data) { root.innerHTML = header + `<div class="flex justify-center p-16"><div class="w-10 h-10 border-4 border-slate-200 rounded-full sp" style="border-top-color:var(--navy)"></div></div>`; return; }

    const d = state.data, ing = d.ingresos, soc = d.socios || {};
    const recaudado = Number(ing.cuotas) + Number(ing.auspicios);
    const metas = cascadaMetas(d.metas || [], recaudado);
    const objetivo = metas.reduce((a, m) => a + m.objetivo, 0);
    const pct = objetivo ? Math.min(1, recaudado / objetivo) : 0;
    const falta = Math.max(0, objetivo - recaudado);
    const porCobrar = Number(soc.por_cobrar || 0);
    const egr = d.egresos_por_categoria || []; const egrTot = Number(d.egresos_total || 0);
    let egrList = egr.map(x => [x.categoria, Number(x.monto)]);
    if (egrList.length > 7) egrList = [...egrList.slice(0, 6), ['Otras categorías', egrList.slice(6).reduce((a, x) => a + x[1], 0)]];
    const maxE = Math.max(1, ...egrList.map(x => x[1]));
    const mens = d.mensual || []; const maxM = Math.max(1, ...mens.map(m => Math.max(m.cuotas + m.auspicios + m.otros, m.egresos)));
    const ausp = d.auspiciadores || [];
    const kpi = (t, v, s, c) => `<div class="card p-4"><p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-1">${t}</p><p class="text-xl md:text-2xl font-extrabold" style="color:${c}">${v}</p><p class="text-[11px] text-slate-500 mt-1">${s}</p></div>`;

    root.innerHTML = header + `<main class="max-w-6xl mx-auto px-3 md:px-4 py-5">
      <p class="text-sm text-slate-600 mb-4">Así se financia el club en ${d.anio}: cuánto aportamos entre todos, en qué se usa y cuánto falta para cumplir las metas. Cifras totales del club, sin datos individuales.</p>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        ${kpi('Recaudado ' + d.anio, fmt(recaudado), `Cuotas ${fmt(ing.cuotas)} · auspicios ${fmt(ing.auspicios)}`, '#1e293b')}
        ${kpi('Saldo disponible', d.saldo_banco ? fmt(d.saldo_banco.monto) : '—', d.saldo_banco ? 'Cuenta del club al ' + d.saldo_banco.fecha.split('-').reverse().join('/') : '', '#22c55e')}
        ${kpi('Falta por recaudar', objetivo ? fmt(falta) : '—', objetivo ? `para las metas ${d.anio}` : 'Metas por definir', '#ef4444')}
        ${kpi('Socios al día', `${soc.al_dia ?? 0} de ${soc.activos ?? 0}`, `Cuotas pendientes en total: ${fmt(porCobrar)}`, '#E8572A')}
      </div>

      <section class="card p-5 mb-5">
        <h2 class="font-extrabold text-slate-800 mb-1">Metas del club ${d.anio}</h2>
        <p class="text-xs text-slate-500 mb-4">Cada peso recaudado cubre primero la meta 1, luego la 2, y así sucesivamente.</p>
        ${metas.length ? `
        <div class="relative h-8 bg-slate-100 rounded-full overflow-hidden mb-4 sm:mb-0">
          <div class="h-full rounded-full transition-all" style="width:${(pct * 100).toFixed(1)}%;background:var(--green)"></div>
          ${metas.slice(0, -1).map(m => `<div class="absolute top-0 h-full border-r-2 border-white" style="left:${(m.fin / objetivo * 100).toFixed(1)}%"></div>`).join('')}
          <span class="absolute inset-0 flex items-center justify-center text-xs font-extrabold text-slate-800">${(pct * 100).toFixed(0)}% de ${fmt(objetivo)}</span>
        </div>
        <div class="relative h-5 mt-1 mb-4 text-[10px] text-slate-500 hidden sm:block">${metas.map((m, i) => `<span class="absolute truncate" style="left:${(m.inicio / objetivo * 100).toFixed(1)}%;max-width:${((m.fin - m.inicio) / objetivo * 100).toFixed(1)}%">Meta ${i + 1}: ${esc(m.nombre)}</span>`).join('')}</div>
        ${falta > 0 && porCobrar > 0 ? `<div class="rounded-xl p-3 mb-4 bg-amber-50 text-amber-900 text-sm">Si todos los socios se ponen al día (${fmt(porCobrar)} pendientes), ${porCobrar >= falta ? '<b>cubrimos todas las metas del año</b>.' : `llegaríamos al <b>${((recaudado + porCobrar) / objetivo * 100).toFixed(0)}%</b> de las metas.`}</div>` : ''}
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${metas.map((m, i) => `<div class="rounded-xl border border-slate-200 p-4">
            <div class="flex justify-between gap-2"><p class="font-bold text-slate-800 text-sm">Meta ${i + 1}: ${esc(m.nombre)}</p><span class="font-extrabold text-sm ${m.pct >= 1 ? 'text-emerald-600' : 'text-slate-500'}">${(m.pct * 100).toFixed(0)}%</span></div>
            ${m.descripcion ? `<p class="text-[11px] text-slate-500">${esc(m.descripcion)}</p>` : ''}
            <div class="h-2 bg-slate-100 rounded-full my-3"><div class="h-full rounded-full" style="width:${(m.pct * 100).toFixed(0)}%;background:${m.pct >= 1 ? 'var(--green)' : '#f59e0b'}"></div></div>
            <p class="text-xs text-slate-700">${m.unidades ? `Con lo recaudado cubrimos <b>${m.unidades.toLocaleString('es-CL')} ${esc(pluralUnidad(m.equivalencia_unidad, m.unidades))}</b>. ` : ''}${m.falta > 0 ? `Faltan <b class="text-rose-600">${fmt(m.falta)}</b> para ${esc(m.nombre.toLowerCase())}.` : '<b class="text-emerald-600">¡Meta cubierta!</b>'}</p>
          </div>`).join('')}</div>`
        : '<p class="text-sm text-slate-400">La directiva está definiendo las metas de este año.</p>'}
      </section>

      <div class="grid lg:grid-cols-2 gap-5 mb-5">
        <section class="card p-5"><h2 class="font-extrabold text-slate-800 mb-3">¿De dónde vienen los ingresos?</h2>
          <div class="flex flex-wrap items-center gap-6">${donut([{ l:'Cuotas', v:Number(ing.cuotas), c:'#1e293b' }, { l:'Auspicios', v:Number(ing.auspicios), c:'#3b82f6' }, { l:'Ventas y aportes', v:Number(ing.otros), c:'#22c55e' }])}
            <div class="text-xs space-y-2 flex-1">${[['Cuotas de socios', ing.cuotas, '#1e293b'], ['Auspicios', ing.auspicios, '#3b82f6'], ['Ventas y aportes (tricotas, eventos…)', ing.otros, '#22c55e']].map(([l, v, c]) => {
              const tt = Number(ing.cuotas) + Number(ing.auspicios) + Number(ing.otros);
              return `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:${c}"></span><span class="text-slate-600">${l}</span><b class="mono ml-auto">${fmt(v)}</b><span class="text-slate-400 w-9 text-right">${tt ? Math.round(v / tt * 100) : 0}%</span></div>`; }).join('')}</div></div></section>
        <section class="card p-5"><h2 class="font-extrabold text-slate-800 mb-3">¿En qué se usa? <span class="text-slate-400 font-normal text-sm">${fmt(egrTot)}</span></h2>
          ${egrList.map(([k, v], i) => `<div class="mb-2"><div class="flex justify-between text-xs mb-0.5"><span class="text-slate-600 truncate">${esc(k)}</span><span class="mono font-bold">${fmt(v)}</span></div>
            <div class="h-2.5 bg-slate-100 rounded-full"><div class="h-full rounded-full" style="width:${(v / maxE * 100).toFixed(1)}%;background:${PALETA[i % PALETA.length]}"></div></div></div>`).join('') || '<p class="text-xs text-slate-400">Sin egresos registrados.</p>'}</section>
      </div>

      <section class="card p-5 mb-5"><h2 class="font-extrabold text-slate-800 mb-1">Mes a mes</h2>
        <p class="text-[11px] text-slate-500 mb-3"><span class="inline-block w-2.5 h-2.5 rounded-sm align-middle" style="background:#1e293b"></span> Ingresos &nbsp; <span class="inline-block w-2.5 h-2.5 rounded-sm align-middle" style="background:#E8572A"></span> Egresos</p>
        <div class="flex items-end gap-1 md:gap-2 h-40 overflow-x-auto">${mens.map(m => { const i = m.cuotas + m.auspicios + m.otros;
          return `<div class="flex-1 min-w-[28px] flex flex-col items-center"><div class="flex items-end gap-0.5 h-32 w-full justify-center">
            <div class="w-1/2 max-w-[18px] rounded-t" style="height:${Math.max(2, i / maxM * 128)}px;background:#1e293b" title="Ingresos ${fmt(i)}"></div>
            <div class="w-1/2 max-w-[18px] rounded-t" style="height:${Math.max(2, m.egresos / maxM * 128)}px;background:#E8572A" title="Egresos ${fmt(m.egresos)}"></div></div>
            <span class="text-[9px] text-slate-500 mt-1">${MS[m.mes - 1]}</span></div>`; }).join('')}</div></section>

      ${ausp.length ? `<section class="card p-5 mb-5"><h2 class="font-extrabold text-slate-800 mb-4 text-center">Nos acompañan</h2>
        <div class="flex flex-wrap items-center justify-center gap-8">${ausp.map(a => { const u = safeUrl(a.sitio_url), logo = safeUrl(a.logo_url);
          const inner = logo ? `<img src="${esc(logo)}" alt="${esc(a.nombre)}" class="${a.nivel === 'SPONSOR_OFICIAL' ? 'h-16' : 'h-10'} max-w-[160px] object-contain">` : `<span class="font-extrabold text-slate-700">${esc(a.nombre)}</span>`;
          return `<div class="text-center">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>` : inner}<p class="text-[9px] uppercase tracking-wider text-slate-400 mt-1">${NIVELES[a.nivel] || ''}</p></div>`; }).join('')}</div></section>` : ''}

      <p class="text-[10px] text-slate-400 text-center">Actualizado ${new Date(d.actualizado).toLocaleString('es-CL')} · Fuente: cartolas BancoEstado conciliadas por la tesorería.</p>
    </main>`;
}
cargar();
</script>
</body>
</html>
