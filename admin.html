    SHEETS_BASE: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTti5wNytfqEQj9SKhGO-01aG9MsAfQhnk1UQjxLBZTGd_UoHW4-mEnBvCtbjUfTvGtXfr-NNhgHvRd/pub?single=true&output=csv&gid=',

const CONFIG_OK = !CONFIG.SUPABASE_URL.includes('TU-PROYECTO');

const sb = CONFIG_OK ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

// ============================================================
// CONSTANTES DE NEGOCIO
// ============================================================
const CUOTA_BASE = 17500;
const CORTE_ABS = 2025 * 12 + 1;               // enero 2025 (inicio de datos históricos)
// Control FIFO desde enero 2026. Todo 2025 se resume en el saldo de apertura al 31/12/2025
// (tabla saldos_apertura), aprobado por la directiva. Misma regla que la vista SQL estado_cuenta_socio.
const CONTROL_ABS = 2026 * 12 + 1;
const INICIO_CONTROL = '2026-01-01';
const DIA_EXIGIBLE = 24;                       // mes en curso exigible desde el día 24
const SCORE_MIN = 30;
const WORD_SPLIT = /[\s_\-\.:;]+/;
const STOP_WORDS = ["que","del","los","las","por","con","sin","tef","cta","cct","bco","trf","spa","ltda","limitada","pago","cuota","mes","mensualidad","transferencia","abono","de","la","traspaso","aporte","khipu","fintoc","transf","banco","estado","bancoestado","fondos","internet","desde"];
// Montos que se consideran cuota "estándar" (múltiplos de media cuota): se auto-confirman.
// Cualquier otro monto con socio identificado queda POR REVISAR (puede ser cuota + extra, licencia, rifa...).
const MULTIPLO_CUOTA = 8750;
const RE_SALIDA = /(SUSPENDID|DESVINCULAD|RETIRAD|INACTIVO|RENUNCIA)/i;
const ESTADOS = ['ACTIVO','SUSPENDIDO','RETIRADO','RENUNCIA','DESVINCULADO','BECADO'];
const SUBCATS = ['CUOTA','AUSPICIO','ARRIENDO','DONACION','OTROS'];
const TIPOS_NOV = [{t:'Congelado',f:0},{t:'Beca 50%',f:0.5},{t:'Beca 100%',f:0}];
// Alias heredados del dashboard (se cargan a la tabla alias_socio al importar socios)
const LEGACY_ALIASES = {
    "armijo churkovic": ["armijo jimenez"],
    "calfuleo": ["christian calfuleo","calfuleo ramirez","matias calfuleo","christian alejandro calfuleo"],
};
const MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MFULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ============================================================
// ESTADO
// ============================================================
const state = {
    session: null, me: null, loading: true, busy: '',
    tab: 'dashboard', dy: String(Math.max(2026, new Date().getFullYear())), dm: 'TODOS', modal: null, metas: [], auspiciadores: [],
    socios: [], aliases: [], novs: [], txs: [], aperturas: [], cartolas: [], actaApertura: '',
    preview: null,                       // resultado de parseo antes de confirmar
    cf: { estado:'REVISAR', tipo:'INGRESO', q:'', mes:'TODOS', page:0 },   // filtros conciliación
    yf: String(Math.max(2026, new Date().getFullYear())), sf: 'ACTIVO', hq: '',          // filtros mapa
    editSocio: null,
};

// ============================================================
// UTILIDADES
// ============================================================
const pad = n => String(n).padStart(2,'0');
const unaccent = s => s == null ? '' : String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const nh = h => unaccent(h).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(v || 0);
const absM = (y,m) => parseInt(y)*12 + parseInt(m);
const absFromISO = iso => iso ? absM(iso.slice(0,4), iso.slice(5,7)) : null;

// Monto: "$17.500", "17.500,00", 17500 → 17500 (siempre positivo)
const cn = v => {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return Math.abs(Math.round(v));
    const s = String(v).trim(); if (!s || s === '-' || s === '$') return 0;
    const n = Number(s.split(',')[0].replace(/[^0-9]/g,''));
    return isNaN(n) ? 0 : n;
};
const cnSigned = v => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Math.round(v);
    const s = String(v).trim(); if (!s || s === '-' || s === '$') return null;
    const neg = /^\s*-|^\s*\(|-\s*$/.test(s);
    const n = cn(s); return neg ? -n : n;
};

const validDate = (y,m,d) => { y=+y; m=+m; d=+d; if (y<2000||y>2100||m<1||m>12||d<1||d>31) return null; return `${y}-${pad(m)}-${pad(d)}`; };
function toISO(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) { if (isNaN(v)) return null; const d = new Date(v.getTime() + 12*3600e3); return validDate(d.getFullYear(), d.getMonth()+1, d.getDate()); }
    if (typeof v === 'number') {
        if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return validDate(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
        return null;
    }
    const s = String(v).trim().split(/[ T]/)[0]; let m;
    if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) return validDate(m[1], m[2], m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) { let y = m[3]; if (y.length === 2) y = '20' + y; return validDate(y, m[2], m[1]); }
    return null;
}

const normRut = r => { const c = String(r || '').replace(/[^0-9kK]/g,'').toUpperCase(); return c.length < 2 ? '' : `${c.slice(0,-1)}-${c.slice(-1)}`; };
const isSalida = estado => RE_SALIDA.test(estado || '');
// Teléfono chileno a formato WhatsApp 569XXXXXXXX
const normTel = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 9 && d[0] === '9') d = '56' + d; return /^569\d{8}$/.test(d) ? d : null; };

function classCat(cat, desc) {
    const u = unaccent(cat).toUpperCase(), d = unaccent(desc).toUpperCase();
    const otros = /TRICOTA|INDUMENTARIA|LICENCIA|ROPA|CALZA|INSCRIPCION|SEGURO|EVENTO/;
    if (otros.test(d) || otros.test(u)) return 'OTROS';
    if (/CUOTA|MENSUALIDAD/.test(u)) return 'CUOTA';
    if (/ARRIENDO|VELO|PISTA/.test(u)) return 'ARRIENDO';
    if (/DONACION/.test(u)) return 'DONACION';
    if (/AUSPICI|PATROCIN|SPONSOR/.test(u)) return 'AUSPICIO';
    return 'OTROS';
}
// Clasificación + estado de revisión.
//  - Con columna Categoría (Sheets): manda la categoría; conciliado si hay socio o no es cuota.
//  - Cartola cruda BancoEstado: socio identificado + monto múltiplo de $8.750 → CUOTA confirmada;
//    socio identificado + otro monto → CUOTA por revisar; sin socio → OTROS por revisar.
function clasificar(tx, socioId) {
    if (tx.tipo === 'EGRESO') return { subcategoria:'EGRESO', conciliado:true };
    if (tx.categoria) {
        const sc = classCat(tx.categoria, tx.descripcion);
        return { subcategoria: sc, conciliado: sc !== 'CUOTA' || !!socioId };
    }
    const d = unaccent(tx.descripcion);
    if (/tricota|indumentaria|licencia|inscripcion|seguro|evento|calza/.test(d)) return { subcategoria:'OTROS', conciliado:false };
    if (/arriendo/.test(d)) return { subcategoria:'ARRIENDO', conciliado:false };
    if (/donacion/.test(d)) return { subcategoria:'DONACION', conciliado:false };
    if (socioId) return { subcategoria:'CUOTA', conciliado: tx.monto % MULTIPLO_CUOTA === 0 };
    return { subcategoria:'OTROS', conciliado:false };
}

function toast(text, type='ok') {
    const el = document.getElementById('toast');
    const cls = type === 'err' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-600';
    el.innerHTML = `<div class="${cls} text-white text-xs font-bold px-4 py-3 rounded-xl shadow-lg max-w-sm">${esc(text)}</div>`;
    clearTimeout(toast._t); toast._t = setTimeout(() => el.innerHTML = '', type === 'err' ? 8000 : 4000);
}
async function withBusy(label, fn) {
    state.busy = label; render();
    try { return await fn(); }
    catch (e) { console.error(e); toast(`Error: ${e.message || e}`, 'err'); }
    finally { state.busy = ''; render(); }
}
const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };

// ============================================================
// SUPABASE: carga de datos (paginada, PostgREST limita a 1000)
// ============================================================
async function fetchAll(table, select='*', order='id') {
    const out = [];
    for (let from = 0; ; from += 1000) {
        const { data, error } = await sb.from(table).select(select).order(order).range(from, from + 999);
        if (error) throw error;
        out.push(...data);
        if (data.length < 1000) break;
    }
    return out;
}
async function loadAll() {
    const [socios, aliases, novs, txs, aperturas, metas, auspiciadores, recordatorios] = await Promise.all([
        fetchAll('socios'), fetchAll('alias_socio'), fetchAll('novedades'), fetchAll('transacciones_banco'),
        fetchAll('saldos_apertura', '*', 'socio_id'), fetchAll('metas'), fetchAll('auspiciadores'), fetchAll('recordatorios'),
    ]);
    const { data: cartolas } = await sb.from('cartolas').select('*').order('created_at', { ascending:false }).limit(1000);
    const { data: config } = await sb.from('config_club').select('*').eq('id', 1).maybeSingle();
    Object.assign(state, { socios, aliases, novs, txs, aperturas, metas, auspiciadores, recordatorios, config, cartolas: cartolas || [] });
}

// ============================================================
// PARSER DE CARTOLAS (CSV / XLS / XLSX de BancoEstado o Sheets)
// Detecta la fila de encabezado y mapea columnas por alias.
// ============================================================
const COLS = {
    fecha:    ['fecha','fecha_movimiento','fecha_operacion'],
    desc:     ['descripcion','detalle','glosa','descripcion_movimiento'],
    sucursal: ['sucursal','canal_o_sucursal','canal'],
    nop:      ['n_operacion','no_operacion','nro_operacion','operacion','n_documento','documento'],
    cargo:    ['cheques_cargos','cargos_clp','cargos','cargo','cheques','giros'],
    abono:    ['depositos_abonos','abonos_clp','abonos','abono','depositos'],
    monto:    ['monto','importe'],
    saldo:    ['saldo_clp','saldo','saldo_diario'],
    categoria:['categoria','clasificacion'],
};
function mapCols(hdr) {
    const H = (hdr || []).map(nh), idx = {}, used = new Set();
    for (const [k, cands] of Object.entries(COLS)) {
        let f = -1;
        for (const c of cands) { f = H.findIndex((h,i) => h === c && !used.has(i)); if (f >= 0) break; }
        if (f < 0) for (const c of cands) { f = H.findIndex((h,i) => h.startsWith(c) && !used.has(i)); if (f >= 0) break; }
        idx[k] = f; if (f >= 0) used.add(f);
    }
    return idx;
}
function detectHeader(rows) {
    for (let i = 0; i < Math.min(40, rows.length); i++) {
        const idx = mapCols(rows[i]);
        if (idx.fecha >= 0 && idx.desc >= 0 && (idx.abono >= 0 || idx.monto >= 0)) return i;
    }
    return -1;
}
// Metadatos de la hoja "Resumen" de la cartola histórica (etiqueta en una celda, valor en la siguiente no vacía)
const META_KEYS = {
    fecha_inicio:'inicio', fecha_final:'final', fecha_emision:'emision', n_cartola:'nCartola', n_movimientos:'nMov',
    saldo_inicial:'saldoInicial', saldo_final:'saldoFinal', total_cargos:'totCargos', total_cheques:'totCheques',
    total_abonos:'totAbonos', total_depositos:'totDepositos', n_cuenta:'cuenta',
};
function extractMeta(sheets) {
    const meta = {};
    for (const rows of sheets) for (const row of rows) {
        if (!row) continue;
        for (let c = 0; c < row.length; c++) {
            const key = META_KEYS[nh(row[c])];
            if (!key || meta[key] != null) continue;
            const val = row.slice(c + 1).find(v => String(v ?? '').trim() !== '');
            if (val == null) continue;
            if (['inicio','final','emision'].includes(key)) meta[key] = toISO(val);
            else if (key.startsWith('saldo') || key.startsWith('tot')) meta[key] = cnSigned(val);
            else meta[key] = String(val).trim();
        }
    }
    return meta;
}
// BancoEstado entrega la fecha como "dd/mm" sin año: se infiere con la Fecha Final del periodo
// (si dd/mm cae después de la fecha final, pertenece al año anterior → cartolas dic/ene).
function fechaConAnio(v, meta) {
    const iso = toISO(v); if (iso) return iso;
    const m = String(v ?? '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
    if (!m) return null;
    const ref = meta.final || meta.emision || `${new Date().getFullYear()}-12-31`;
    let y = parseInt(ref.slice(0, 4));
    let f = validDate(y, m[2], m[1]);
    if (f && f > ref) f = validDate(y - 1, m[2], m[1]);
    return f;
}
// Cuadratura: encadenamiento de saldos fila a fila y contra los totales del Resumen.
function cuadratura(txs, meta) {
    const signo = t => t.tipo === 'INGRESO' ? t.monto : -t.monto;
    const res = { quiebres: 0, conSaldo: txs.every(t => t.saldo != null), checks: [] };
    if (!txs.length || !res.conSaldo) return res;
    for (let i = 1; i < txs.length; i++) if (txs[i-1].saldo + signo(txs[i]) !== txs[i].saldo) res.quiebres++;
    res.saldoPrevio = txs[0].saldo - signo(txs[0]);
    res.saldoFinal = txs[txs.length - 1].saldo;
    const sumAb = txs.filter(t => t.tipo === 'INGRESO').reduce((a, t) => a + t.monto, 0);
    const sumCa = txs.filter(t => t.tipo === 'EGRESO').reduce((a, t) => a + t.monto, 0);
    const chk = (label, esperado, real) => { if (esperado != null) res.checks.push({ label, ok: esperado === real, esperado, real }); };
    chk('Saldo inicial', meta.saldoInicial, res.saldoPrevio);
    chk('Saldo final', meta.saldoFinal, res.saldoFinal);
    chk('Total abonos', meta.totAbonos != null ? meta.totAbonos + (meta.totDepositos || 0) : null, sumAb);
    chk('Total cargos', meta.totCargos != null ? meta.totCargos + (meta.totCheques || 0) : null, sumCa);
    chk('N° movimientos', meta.nMov != null ? parseInt(meta.nMov) : null, txs.length);
    return res;
}
function rowsToTxs(rows, meta = {}) {
    const hi = detectHeader(rows);
    if (hi < 0) throw new Error('No encontré la fila de encabezados (se necesitan columnas Fecha, Descripción y Abonos/Depósitos o Monto).');
    const idx = mapCols(rows[hi]);
    const out = [], seen = {}; let descartadas = 0;
    for (let r = hi + 1; r < rows.length; r++) {
        const row = rows[r]; if (!row || !row.length) continue;
        const g = k => idx[k] >= 0 ? row[idx[k]] : '';
        const fecha = fechaConAnio(g('fecha'), meta);
        if (!fecha) { if (row.some(c => String(c ?? '').trim() !== '')) descartadas++; continue; }
        let abono = cn(g('abono')), cargo = cn(g('cargo'));
        if (idx.abono < 0 && idx.monto >= 0) {
            const raw = g('monto'), v = cnSigned(raw);
            if (v < 0) cargo = -v; else abono = v || 0;
        }
        let tipo, monto;
        if (abono > 0) { tipo = 'INGRESO'; monto = abono; }
        else if (cargo > 0) { tipo = 'EGRESO'; monto = cargo; }
        else { descartadas++; continue; }
        const descripcion = String(g('desc') ?? '').trim();
        const saldo = cnSigned(g('saldo'));
        const categoria = String(g('categoria') ?? '').trim() || null;
        // Clave de deduplicación: el saldo post-movimiento identifica la fila de forma estable
        // entre archivos solapados; sin saldo se usa la descripción. El correlativo (#n)
        // distingue movimientos idénticos el mismo día.
        const base = saldo != null
            ? `${fecha}|${tipo}|${monto}|S${saldo}`
            : `${fecha}|${tipo}|${monto}|D${unaccent(descripcion).replace(/\s+/g,' ').trim()}`;
        seen[base] = (seen[base] || 0) + 1;
        out.push({
            fecha, descripcion, tipo, monto, saldo, categoria,
            sucursal: String(g('sucursal') ?? '').trim() || null,
            n_operacion: String(g('nop') ?? '').trim() || null,
            hash_unico: `${base}#${seen[base]}`,
        });
    }
    return { txs: out, header: rows[hi], idx, descartadas, cuad: cuadratura(out, meta) };
}
// Lee CSV/XLS/XLSX. En la cartola histórica de BancoEstado los movimientos están en la hoja
// "Movimientos" y los totales en "Resumen": se recorren todas las hojas.
async function readFileSheets(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.pdf')) throw new Error('El PDF no se puede procesar: descarga la cartola en formato Excel (ícono verde XLS).');
    if (name.endsWith('.csv') || name.endsWith('.txt')) {
        const rows = await new Promise((res, rej) => Papa.parse(file, { header:false, skipEmptyLines:'greedy', complete: x => res(x.data), error: rej }));
        return [rows];
    }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:'' }));
}
function parseSheets(sheets, metaExtra = {}) {
    const meta = { ...extractMeta(sheets), ...metaExtra };
    const mov = sheets.find(rows => detectHeader(rows) >= 0);
    if (!mov) throw new Error('No encontré la tabla de movimientos en ninguna hoja del archivo.');
    return { ...rowsToTxs(mov, meta), meta };
}
const csvFromUrl = (url, header=false) => new Promise((res, rej) =>
    Papa.parse(url, { download:true, header, skipEmptyLines:'greedy', transformHeader: h => h.trim(), complete: x => res(x.data), error: rej }));

// ============================================================
// MOTOR DE MATCHING (scoring ponderado + asignación exclusiva)
//  100 = RUT en la glosa · 95 = alias conocido · 30-90 = nombre
//  ponderado por unicidad de palabra · empate en el máximo => manual
// ============================================================
// Nombre del titular que transfiere, tal como lo escribe el banco en la glosa:
//   "TEF DE PAINEQUEO HERRERA CARLOS SAL" · "TEF BANCOESTADO DE VEGA CESPED REN" · "TRASPASO DE:Matias Soto"
// (las TEF salientes "TEF A ..." no son pagos de socios y se ignoran)
const RE_PAYER = /^\s*(?:tef\s+(?:bancoestado\s+)?de|traspaso\s+de|transferencia\s+desde|transferencia\s+de)\s*[:\s]\s*/;
function extractPayer(desc) {
    const d = unaccent(desc).replace(/\s+/g, ' ').trim();
    const m = d.match(RE_PAYER);
    return m ? d.slice(m[0].length).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim() : '';
}
// Alias normalizado: si viene con prefijo bancario (ej. columna Nombre_Banco "TEF DE ..."), se deja solo el nombre
const normAlias = a => { const p = extractPayer(a); return (p || unaccent(a).replace(/[^a-z0-9 ]/g, ' ')).replace(/\s+/g, ' ').trim(); };

function buildMatchCtx() {
    const wordFreq = {};
    const items = state.socios.map(s => {
        const words = unaccent(s.nombre).split(WORD_SPLIT).filter(w => w.length > 2 && !STOP_WORDS.includes(w));
        words.forEach(w => wordFreq[w] = (wordFreq[w] || 0) + 1);
        return {
            id: s.id, words,
            rut: String(s.rut || '').replace(/[^0-9kK]/g,'').toLowerCase(),
            als: state.aliases.filter(a => a.socio_id === s.id).map(a => normAlias(a.alias)).filter(a => a.length >= 4),
        };
    });
    return { items, wordFreq };
}
function matchTx(tx, ctx) {
    const txText = unaccent(tx.descripcion);
    const txNum = txText.replace(/[^0-9k]/g,'');
    const txWords = txText.split(WORD_SPLIT).filter(w => w.length > 2 && !STOP_WORDS.includes(w));
    const payer = extractPayer(tx.descripcion);
    const txFlat = txText.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ');
    // Alias: aparece en la glosa, o la glosa (truncada a ~35 caracteres por BancoEstado) es el inicio del alias
    const aliasHit = a => txFlat.includes(a) || (payer.length >= 15 && a.startsWith(payer));
    let best = { sid:null, sc:0 }, second = 0;
    for (const it of ctx.items) {
        let sc = 0;
        if (it.rut.length >= 7) {
            const base = it.rut.slice(0,-1);
            if (txNum.includes(it.rut) || (base.length >= 7 && txNum.includes(base))) sc = 100;
        }
        if (!sc && it.als.some(aliasHit)) sc = 95;
        if (!sc && it.words.length) {
            let wScore = 0, matched = 0;
            for (const nw of it.words) {
                const hit = txWords.some(tw => nw === tw || (nw.length >= 4 && tw.length >= 4 && (nw.startsWith(tw) || tw.startsWith(nw))));
                if (hit) { matched++; wScore += 1 / (ctx.wordFreq[nw] || 1); }
            }
            if (matched >= 2) {
                const cov = matched / it.words.length;
                sc = Math.round(cov * 45 + Math.min(wScore / it.words.length, 1) * 45);
            }
        }
        if (sc > best.sc) { second = best.sc; best = { sid: it.id, sc }; }
        else if (sc > second) second = sc;
    }
    if (best.sc < SCORE_MIN) return { sid:null, sc:best.sc, motivo:'SIN_MATCH' };
    if (second === best.sc) return { sid:null, sc:best.sc, motivo:'EMPATE' };
    return { sid: best.sid, sc: best.sc, motivo:'OK' };
}
// Enriquece filas parseadas con matching + clasificación
function enrich(txs) {
    const ctx = buildMatchCtx();
    return txs.map(t => {
        const auspId = matchAuspiciador(t);
        if (auspId) return { ...t, socio_id: null, auspiciador_id: auspId, score_matching: 95, asignacion: 'AUTO', conciliado: true, subcategoria: 'AUSPICIO', _motivo: 'AUSPICIO' };
        const m = t.tipo === 'INGRESO' ? matchTx(t, ctx) : { sid:null, sc:null, motivo:'EGRESO' };
        const c = clasificar(t, m.sid);
        return { ...t, auspiciador_id: null, socio_id: m.sid, score_matching: m.sc, asignacion: m.sid ? 'AUTO' : null,
                 conciliado: c.conciliado, subcategoria: c.subcategoria, _motivo: m.motivo };
    });
}

async function onFileSelected(input) {

    await withBusy(`Leyendo ${files.length} archivo(s)...`, async () => {
        const lotes = [];

        }
        buildPreview(lotes);

}
async function importSheetTxs(year) {

        const rows = await csvFromUrl(CONFIG.SHEETS_BASE + (year === '2025' ? CONFIG.GID.t2025 : CONFIG.GID.t2026));
        // La hoja puede traer fechas dd/mm sin año: se asume el año de la hoja
        const parsed = parseSheets([rows], { final: `${year}-12-31` });
        buildPreview([{ nombre: `Google Sheets ${year}`, origen: `SHEETS_${year}`, file: null, parsed }]);

}
function buildPreview(lotes) {
    if (!state.socios.length) toast('No hay socios cargados: el matching no asignará nada. Importa el padrón primero.', 'warn');
    const existentes = new Set(state.txs.map(t => t.hash_unico));
    const saldosDB = new Set(state.txs.filter(t => t.saldo != null).map(t => Number(t.saldo)));
    const firmaDB = new Map();     // fecha|tipo|monto → n, para detectar posibles duplicados con hash distinto
    state.txs.forEach(t => { const k = `${t.fecha}|${t.tipo}|${t.monto}`; firmaDB.set(k, (firmaDB.get(k) || 0) + 1); });
    const vistos = new Set();
    lotes.forEach(l => {
        l.rows = enrich(l.parsed.txs).map(r => {
            r._dup = existentes.has(r.hash_unico) || vistos.has(r.hash_unico);
            r._posDup = !r._dup && firmaDB.has(`${r.fecha}|${r.tipo}|${r.monto}`) && r.saldo == null;
            vistos.add(r.hash_unico);
            return r;
        });
        const f = l.rows.map(r => r.fecha).sort();
        l.periodo = f.length ? `${f[0]} a ${f[f.length - 1]}` : '';
        const c = l.parsed.cuad;
        // Continuidad: el saldo previo al primer movimiento debe existir en la base (salvo base vacía)
        const primera = [...l.parsed.txs].sort((a, b) => a.fecha.localeCompare(b.fecha))[0];
        const hayAnteriores = primera && state.txs.some(t => t.fecha < primera.fecha);
        l.continuidad = c.saldoPrevio == null ? null
            : saldosDB.size === 0 ? 'BASE_VACIA'
            : l.rows.every(r => r._dup) ? null
            : !hayAnteriores ? 'INICIO'
            : saldosDB.has(c.saldoPrevio) ? 'OK' : 'HUECO';
    });
    state.preview = { lotes, rows: lotes.flatMap(l => l.rows) };
    state.tab = 'cartola';
}
async function commitPreview() {
    const p = state.preview; if (!p) return;
    await withBusy('Guardando movimientos...', async () => {
        const tot = { nuevas:0, dup:0, match:0 };
        for (const l of p.lotes) {
            const { data: cart, error: e1 } = await sb.from('cartolas').insert({
                nombre_archivo: l.nombre + (l.parsed.meta.nCartola ? ` (N° ${l.parsed.meta.nCartola})` : ''),
                origen: l.origen, periodo: l.periodo, filas_procesadas: l.rows.length, subido_por: state.me?.id || null,
            }).select().single();
            if (e1) throw e1;
            if (l.file) {
                const path = `${new Date().toISOString().slice(0,10)}/${Date.now()}_${l.file.name.replace(/[^\w.\-]/g,'_')}`;
                const { error: eu } = await sb.storage.from('cartolas').upload(path, l.file);
                if (!eu) await sb.from('cartolas').update({ archivo_url: path }).eq('id', cart.id);
                else console.warn('Storage:', eu.message);
            }
            const clean = l.rows.map(r => ({
                fecha: r.fecha, descripcion: r.descripcion, sucursal: r.sucursal, n_operacion: r.n_operacion,
                monto: r.monto, tipo: r.tipo, categoria: r.categoria, subcategoria: r.subcategoria, saldo: r.saldo,
                socio_id: r.socio_id, score_matching: r.score_matching, asignacion: r.asignacion,
                conciliado: r.conciliado, hash_unico: r.hash_unico, cartola_id: cart.id, auspiciador_id: r.auspiciador_id || null,
            }));
            const nuevas = [];
            for (const c of chunk(clean, 500)) {
                // ignoreDuplicates: filas ya importadas (y sus asignaciones manuales) no se tocan
                const { data, error } = await sb.from('transacciones_banco')
                    .upsert(c, { onConflict:'hash_unico', ignoreDuplicates:true }).select('id,socio_id');
                if (error) throw error;
                nuevas.push(...(data || []));
            }
            const stats = { filas_nuevas: nuevas.length, filas_duplicadas: clean.length - nuevas.length,
                            filas_matcheadas: nuevas.filter(n => n.socio_id).length };
            await sb.from('cartolas').update(stats).eq('id', cart.id);
            tot.nuevas += stats.filas_nuevas; tot.dup += stats.filas_duplicadas; tot.match += stats.filas_matcheadas;
        }
        state.preview = null;
        await loadAll();
        toast(`Importadas ${tot.nuevas} filas nuevas (${tot.dup} ya existían). Con socio identificado: ${tot.match}.`);
    });
}

const normObj = raw => { const o = {}; for (const k in raw) o[nh(k)] = String(raw[k] ?? '').trim(); return o; };
const gv = (r, ks) => { for (const k of ks) if (r[k]) return r[k]; return ''; };

async function importSociosSheet() {
    await withBusy('Importando padrón de socios...', async () => {
        const data = await csvFromUrl(CONFIG.SHEETS_BASE + CONFIG.GID.socios, true);
        const sinRut = [], rows = new Map(), nbPorRut = new Map();
        for (const raw of data) {
            const r = normObj(raw);
            const nombre = gv(r, ['nombre_completo','nombre','socio']);
            if (!nombre || nombre.length <= 2) continue;
            const rut = normRut(gv(r, ['rut']));
            if (!rut) { sinRut.push(nombre); continue; }
            const estado = (gv(r, ['estado_en_el_club','estado','status']) || 'ACTIVO').toUpperCase();
            const fsal = toISO(gv(r, ['fecha_act_estado','fecha_de_salida','fecha_salida','baja','retiro']));
            const nb = gv(r, ['nombre_banco','nombre_en_banco','titular_cuenta']);
            if (nb) nbPorRut.set(rut, nb);
            rows.set(rut, {
                rut, nombre, estado,
                tipo_socio: gv(r, ['tipo_socio','tipo']) || null,
                fecha_ingreso: toISO(gv(r, ['fecha_de_ingreso','fecha_ingreso','fechaingreso'])),
                fecha_salida: isSalida(estado) ? fsal : null,
            });
        }
        // upsert por RUT: no toca rol, auth_user_id, email ni cuota de socios existentes
        for (const c of chunk([...rows.values()], 200)) {
            const { error } = await sb.from('socios').upsert(c, { onConflict:'rut' });
            if (error) throw error;
        }
        await loadAll();
        // Alias heredados
        const al = [];
        for (const [k, vs] of Object.entries(LEGACY_ALIASES))
            state.socios.filter(s => unaccent(s.nombre).includes(k)).forEach(s => vs.forEach(a => al.push({ socio_id: s.id, alias: a })));
        // Columna Nombre_Banco del padrón: nombre con que aparece la transferencia en la cartola
        state.socios.forEach(s => { const nb = nbPorRut.get(s.rut); if (nb && normAlias(nb).length >= 8) al.push({ socio_id: s.id, alias: normAlias(nb) }); });
        if (al.length) await sb.from('alias_socio').upsert(al, { onConflict:'socio_id,alias', ignoreDuplicates:true });
        await loadAll();
        toast(`Padrón: ${rows.size} socios sincronizados.${sinRut.length ? ` ${sinRut.length} sin RUT omitidos: ${sinRut.slice(0,5).join(', ')}${sinRut.length > 5 ? '…' : ''}` : ''}`, sinRut.length ? 'warn' : 'ok');
    });
}
function factorDeTipo(tipo) {
    const t = unaccent(tipo).toUpperCase();
    if (/CONGELA|MONTO.?0/.test(t)) return 0;
    if (/50/.test(t)) return 0.5;
    if (/BECA/.test(t)) return 0;
    return 1;
}
async function importNovedadesSheet() {
    if (!confirm('Esto REEMPLAZA todas las novedades actuales por las de Google Sheets. ¿Continuar?')) return;
    await withBusy('Importando novedades...', async () => {
        const data = await csvFromUrl(CONFIG.SHEETS_BASE + CONFIG.GID.novedades, true);
        const byRut = new Map(state.socios.map(s => [String(s.rut).replace(/[^0-9kK]/g,'').toUpperCase(), s]));
        const out = [], noMatch = [];
        for (const raw of data) {
            const r = normObj(raw);
            const rutC = gv(r, ['rut']).replace(/[^0-9kK]/g,'').toUpperCase();
            const nom = gv(r, ['nombre_completo','nombre']);
            let s = rutC ? byRut.get(rutC) : null;
            if (!s && nom) s = state.socios.find(x => unaccent(x.nombre) === unaccent(nom));
            const fi = toISO(gv(r, ['fecha_inicio']));
            if (!s || !fi) { if (rutC || nom) noMatch.push(nom || rutC); continue; }
            const tipo = gv(r, ['tipo_de_novedad','tipo_novedad','novedad']) || 'Congelado';
            out.push({ socio_id: s.id, tipo_novedad: tipo, factor_cuota: factorDeTipo(tipo),
                       fecha_inicio: fi, fecha_termino: toISO(gv(r, ['fecha_termino','fecha_fin'])) });
        }
        const { error: ed } = await sb.from('novedades').delete().gte('id', 0); if (ed) throw ed;
        if (out.length) { const { error } = await sb.from('novedades').insert(out); if (error) throw error; }
        await loadAll();
        toast(`Novedades: ${out.length} cargadas.${noMatch.length ? ` ${noMatch.length} sin socio o sin fecha: ${noMatch.slice(0,4).join(', ')}` : ''}`, noMatch.length ? 'warn' : 'ok');
    });
}

async function patchTx(txId, patch) {
    const { error } = await sb.from('transacciones_banco').update(patch).eq('id', txId);
    if (error) { toast(error.message, 'err'); return false; }
    Object.assign(state.txs.find(t => t.id === txId), patch); render(); return true;
}
// Asignación manual = decisión humana → queda conciliado
async function setSocio(txId, val) {
    const socio_id = val ? parseInt(val) : null;
    const tx = state.txs.find(t => t.id === txId);
    const patch = socio_id
        ? { socio_id, asignacion:'MANUAL', conciliado:true, score_matching:null }
        : { socio_id:null, asignacion:null, conciliado:false, score_matching:null };
    if (socio_id && tx.tipo === 'INGRESO' && tx.subcategoria === 'OTROS' && !tx.categoria) patch.subcategoria = 'CUOTA';
    if (await patchTx(txId, patch) && socio_id) await aprenderAlias(tx, socio_id);
}
// Aprendizaje: al asignar a mano, el nombre del titular de la glosa se guarda como alias del socio,
// así la próxima transferencia de esa misma cuenta se asigna sola (score 95).
// Si ese titular ya es alias de OTRO socio (ej. un apoderado que paga por dos hijos) no se guarda:
// ese caso debe seguir siendo manual.
async function aprenderAlias(tx, socio_id) {
    const payer = extractPayer(tx.descripcion);
    const palabras = payer.split(' ').filter(w => w.length > 2 && !STOP_WORDS.includes(w));
    if (payer.length < 8 || palabras.length < 2) return;
    const existentes = state.aliases.filter(a => normAlias(a.alias) === payer);
    if (existentes.some(a => a.socio_id === socio_id)) return;
    if (existentes.length) { toast(`"${payer}" ya es alias de otro socio: no se aprendió (pagos compartidos quedan manuales).`, 'warn'); return; }
    const { data, error } = await sb.from('alias_socio').insert({ socio_id, alias: payer }).select().single();
    if (!error && data) { state.aliases.push(data); toast(`Alias aprendido: "${payer}" → ${socioById(socio_id)?.nombre}`); }
}
async function setSubcat(txId, val) {
    const tx = state.txs.find(t => t.id === txId);
    // Una CUOTA sin socio no está conciliada; cualquier otra categoría elegida a mano sí
    if (val === 'AUSPICIO') return patchTx(txId, { subcategoria: val, socio_id: null, asignacion: null, conciliado: !!tx.auspiciador_id });
    await patchTx(txId, { subcategoria: val, auspiciador_id: null, conciliado: val !== 'CUOTA' || !!tx.socio_id });
}
async function confirmarTx(txId) { await patchTx(txId, { conciliado: true }); }

async function rematchSinAsignar() {
    await withBusy('Re-ejecutando matching sobre ingresos sin socio...', async () => {
        const ctx = buildMatchCtx();
        const pend = state.txs.filter(t => t.tipo === 'INGRESO' && !t.socio_id && t.subcategoria !== 'AUSPICIO');
        const updates = [];
        for (const t of pend) {
            const m = matchTx(t, ctx);
            if (!m.sid) continue;
            const c = clasificar(t, m.sid);
            updates.push({ id: t.id, patch: { socio_id: m.sid, score_matching: m.sc, asignacion:'AUTO',
                subcategoria: c.subcategoria, conciliado: c.conciliado } });
        }
        for (const c of chunk(updates, 20))
            await Promise.all(c.map(u => sb.from('transacciones_banco').update(u.patch).eq('id', u.id)));
        await loadAll();
        toast(`${updates.length} de ${pend.length} ingresos sin socio fueron asignados.`);
    });
}

// ============================================================
// FIFO ("llenado de vaso") — misma regla que la vista SQL
// ============================================================
function computeEstado() {
    const hoy = new Date();
    const curAbs = absM(hoy.getFullYear(), hoy.getMonth() + 1);
    const lastWeek = hoy.getDate() >= DIA_EXIGIBLE;
    const maxAbs = absM(Math.max(hoy.getFullYear(), 2026), 12);

    const novBy = new Map();
    state.novs.forEach(n => {
        if (!novBy.has(n.socio_id)) novBy.set(n.socio_id, []);
        novBy.get(n.socio_id).push({ fi: absFromISO(n.fecha_inicio), ft: n.fecha_termino ? absFromISO(n.fecha_termino) : Infinity, f: Number(n.factor_cuota) });
    });
    const pagadoBy = new Map();
    state.txs.forEach(t => {
        if (t.tipo !== 'INGRESO' || t.subcategoria !== 'CUOTA' || !t.socio_id || t.fecha < INICIO_CONTROL) return;
        pagadoBy.set(t.socio_id, (pagadoBy.get(t.socio_id) || 0) + t.monto);
    });

    const aperBy = new Map((state.aperturas || []).map(a => [a.socio_id, a]));
    return state.socios.map(s => {
        const ingAbs = s.fecha_ingreso ? absFromISO(s.fecha_ingreso) : CONTROL_ABS;
        const primer = Math.max(ingAbs, CONTROL_ABS);
        const susp = isSalida(s.estado);
        const salidaAbs = susp ? (s.fecha_salida ? absFromISO(s.fecha_salida) : curAbs) : Infinity;
        const cuotaBase = s.cuota_mensual ?? CUOTA_BASE;
        const ap = aperBy.get(s.id);
        const saldoApertura = ap ? Number(ap.saldo) : 0;   // + a favor / - deuda 2025
        // FIFO: el saldo de apertura entra como "primer pago" (o primera deuda) del vaso
        const totalPagado = (pagadoBy.get(s.id) || 0) + saldoApertura;
        const nv = novBy.get(s.id) || [];
        const monthMap = {};
        let exig = 0;
        for (let a = CONTROL_ABS; a <= maxAbs; a++) {
            if (a < primer) { monthMap[a] = { st:'na', lb:'—' }; continue; }
            if (susp && a > salidaAbs) { monthMap[a] = { st:'susp', lb:'S' }; continue; }
            if (a > curAbs) { monthMap[a] = { st:'future', lb:'·' }; continue; }
            const vig = nv.filter(n => a >= n.fi && a <= n.ft);
            const factor = vig.length ? Math.min(...vig.map(n => n.f)) : 1;
            const cuotaMes = Math.round(cuotaBase * factor);
            const isCur = a === curAbs, req = !(isCur && !lastWeek);
            if (req) exig += cuotaMes;
            const meta = req ? exig : exig + cuotaMes;
            const paid = totalPagado >= meta;
            const st = paid ? 'paid' : (isCur && !lastWeek ? 'future' : 'unpaid');
            monthMap[a] = { st, lb: paid ? '✓' : st === 'future' ? '·' : '✗', exc: factor < 1, cuotaMes, meta };
        }
        const deuda = Math.max(0, exig - totalPagado);
        return { ...s, susp, monthMap, totalPagado, saldoApertura, aperturaAprobada: !!ap?.aprobado, exig, deuda, impagos: deuda > 0 && cuotaBase > 0 ? Math.ceil(deuda / cuotaBase) : 0 };
    }).sort((a, b) => b.deuda - a.deuda || a.nombre.localeCompare(b.nombre));
}

}

// ============================================================
// ESTADO DE CUENTAS: recaudación potencial + cuadratura de caja
//  - Caja real: solo movimientos de cartolas del banco (origen ARCHIVO).
//    Saldo inicial + ingresos − egresos debe dar EXACTO el saldo de la cartola.
//  - Potencial: lo que habría si todos los socios pagan (caja + por cobrar).
//    El por cobrar NO es caja: se muestra aparte.
// ============================================================
function viewCaja(data) {
    const pct = (v, t) => t ? Math.round(v / t * 100) + '%' : '0%';
    // --- Recaudación de cuotas (respeta el filtro Activos / Suspendidos / Todos) ---
    // Solo socios activos: la deuda de suspendidos/retirados se considera incobrable y no se contabiliza
    const grupo = data.filter(s => !s.susp);
    const exig = grupo.reduce((a, s) => a + s.exig, 0);                                   // cuotas 2026 exigibles a la fecha
    const deuda25 = grupo.reduce((a, s) => a + Math.max(0, -s.saldoApertura), 0);         // deuda arrastrada al 31/12/2025
    const favor25 = grupo.reduce((a, s) => a + Math.max(0, s.saldoApertura), 0);
    const pagado = grupo.reduce((a, s) => a + (s.totalPagado - s.saldoApertura), 0);      // cuotas pagadas 2026
    const porCobrar = grupo.reduce((a, s) => a + s.deuda, 0);
    const anticipado = grupo.reduce((a, s) => a + Math.max(0, s.totalPagado - s.exig), 0); // pagos por adelantado
    const potencial = exig + deuda25;                                                      // si todos pagan lo exigible
    const cobrado = Math.max(0, potencial - porCobrar);
    const nombreGrupo = 'socios activos';

    // --- Caja real: cuenta bancaria ---
    const origen = new Map(state.cartolas.map(c => [c.id, c.origen]));
    const mov = state.txs.filter(t => origen.get(t.cartola_id) === 'ARCHIVO').sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id - b.id);
    const neto = t => t.tipo === 'INGRESO' ? t.monto : -t.monto;
    const sInicial = mov.length && mov[0].saldo != null ? mov[0].saldo - neto(mov[0]) : 0;
    const ingB = mov.filter(t => t.tipo === 'INGRESO'), egB = mov.filter(t => t.tipo === 'EGRESO');
    const sum = a => a.reduce((x, t) => x + t.monto, 0);
    const ingTot = sum(ingB), egTot = sum(egB);
    const ingCuota = sum(ingB.filter(t => t.subcategoria === 'CUOTA')), ingAusp = sum(ingB.filter(t => t.subcategoria === 'AUSPICIO'));
    const ingOtros = ingTot - ingCuota - ingAusp;
    const sCalc = sInicial + ingTot - egTot;
    const ult = mov[mov.length - 1]; const sBanco = ult ? Number(ult.saldo) : null;
    const dif = sBanco == null ? null : sCalc - sBanco;
    const fueraBanco = state.txs.filter(t => t.fecha >= INICIO_CONTROL && origen.get(t.cartola_id) !== 'ARCHIVO');
    const desde = mov[0]?.fecha?.split('-').reverse().join('/'), hasta = ult?.fecha?.split('-').reverse().join('/');
    const proyectado = (sBanco ?? sCalc) + porCobrar;

    // --- Cascada SVG: saldo inicial → +ingresos → −egresos → saldo banco → +por cobrar → potencial ---
    const pasos = [
        { l: 'Saldo inicial', v: sInicial, tipo: 'total', c: '#94a3b8' },
        { l: 'Ingresos', v: ingTot, tipo: 'sube', c: '#1e293b' },
        { l: 'Egresos', v: -egTot, tipo: 'baja', c: '#E8572A' },
        { l: 'Saldo banco', v: sBanco ?? sCalc, tipo: 'total', c: '#22c55e' },
        { l: 'Por cobrar', v: porCobrar, tipo: 'sube', c: '#f59e0b', punteado: true },
        { l: 'Si todos pagan', v: proyectado, tipo: 'total', c: '#3b82f6', punteado: true },
    ];
    let nivel = 0; const barras = pasos.map(p => { let a, b;
        if (p.tipo === 'total') { a = 0; b = p.v; nivel = p.v; } else { a = nivel; b = nivel + p.v; nivel = b; }
        return { ...p, a: Math.min(a, b), b: Math.max(a, b) }; });
    const maxV = Math.max(1, ...barras.map(x => x.b)), W = 620, H = 210, top = 22, base = 170, bw = 70, gap = (W - bw * barras.length) / (barras.length + 1);
    const yy = v => base - (v / maxV) * (base - top);
    const svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:240px">
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#e2e8f0"/>
      ${barras.map((x, i) => { const X = gap + i * (bw + gap); const y1 = yy(x.b), h = Math.max(2, yy(x.a) - yy(x.b));
        const sig = x.tipo === 'sube' ? '+' : x.tipo === 'baja' ? '−' : '';
        return `<rect x="${X}" y="${y1}" width="${bw}" height="${h}" rx="4" fill="${x.c}" ${x.punteado ? 'fill-opacity="0.35" stroke="' + x.c + '" stroke-dasharray="4 3"' : ''}><title>${x.l}: ${fmt(Math.abs(x.v))}</title></rect>
          <text x="${X + bw / 2}" y="${y1 - 6}" text-anchor="middle" font-size="11" font-weight="800" fill="#1e293b">${sig}${fmtK(Math.abs(x.v))}</text>
          <text x="${X + bw / 2}" y="${base + 16}" text-anchor="middle" font-size="10" fill="#64748b">${x.l}</text>
          ${i < barras.length - 1 ? `<line x1="${X + bw}" y1="${yy(nivelTras(barras, i))}" x2="${X + bw + gap}" y2="${yy(nivelTras(barras, i))}" stroke="#cbd5e1" stroke-dasharray="3 3"/>` : ''}`; }).join('')}
    </svg>`;

    const fila = (l, v, p, color = 'text-slate-800', extra = '') => `<div class="flex items-center justify-between py-1.5 border-b border-slate-50 text-xs ${extra}"><span class="text-slate-600">${l}</span><span class="flex gap-3 items-baseline"><b class="mono ${color}">${fmt(v)}</b><span class="text-slate-400 w-10 text-right">${p}</span></span></div>`;
    return `<div class="grid xl:grid-cols-5 gap-4 mb-4">
      <div class="card p-4 xl:col-span-2">
        <h2 class="font-bold text-slate-800 text-sm">Recaudación de cuotas · ${nombreGrupo}</h2>
        <p class="text-[11px] text-slate-500 mb-3">Cuánto deberíamos tener si todos pagan lo exigible a la fecha (2026 + deuda de apertura).</p>
        <div class="flex flex-wrap items-center gap-5">
          ${svgDonut([{ l: 'Cobrado', v: cobrado, c: '#22c55e' }, { l: 'Por cobrar', v: porCobrar, c: '#ef4444' }])}
          <div class="flex-1 min-w-[230px]">
            ${fila('<b>Potencial si todos pagan</b>', potencial, '100%', 'text-slate-900')}
            ${fila('&nbsp;&nbsp;Cuotas 2026 exigibles', exig, pct(exig, potencial), 'text-slate-600')}
            ${fila('&nbsp;&nbsp;Deuda arrastrada 2025', deuda25, pct(deuda25, potencial), 'text-slate-600')}
            ${fila('<span class="inline-block w-2.5 h-2.5 rounded-sm align-middle mr-1" style="background:#22c55e"></span>Cobrado', cobrado, pct(cobrado, potencial), 'text-emerald-700')}
            ${fila('<span class="inline-block w-2.5 h-2.5 rounded-sm align-middle mr-1" style="background:#ef4444"></span>Por cobrar', porCobrar, pct(porCobrar, potencial), 'text-rose-600')}
            <p class="text-[10px] text-slate-400 mt-2">Pagado en 2026: ${fmt(pagado)} · saldos a favor 2025: ${fmt(favor25)} · pagos adelantados: ${fmt(anticipado)}.</p>
          </div>
        </div>
      </div>
      <div class="card p-4 xl:col-span-3">
        <div class="flex flex-wrap justify-between items-start gap-2 mb-1">
          <div><h2 class="font-bold text-slate-800 text-sm">Flujo de caja · cuenta banco ${desde ? `(${desde} → ${hasta})` : ''}</h2>
            <p class="text-[11px] text-slate-500">Solo movimientos de las cartolas del banco. Lo punteado (por cobrar) aún no es caja.</p></div>
          ${dif == null ? '' : dif === 0 ? '<span class="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg">✓ Cuadra con la cartola</span>'
            : `<span class="text-[11px] font-bold bg-rose-100 text-rose-700 px-2 py-1 rounded-lg">Diferencia con cartola: ${fmt(dif)}</span>`}
        </div>
        ${mov.length ? svg : '<p class="text-xs text-slate-400 p-6 text-center">Sube cartolas del banco para ver el flujo de caja.</p>'}
        <div class="grid md:grid-cols-2 gap-x-6 mt-2">
          <div>${fila('Saldo inicial cuenta', sInicial, '')}
            ${fila('+ Ingresos', ingTot, '100%', 'text-slate-900')}
            ${fila('&nbsp;&nbsp;Cuotas', ingCuota, pct(ingCuota, ingTot), 'text-slate-600')}
            ${ingAusp ? fila('&nbsp;&nbsp;Auspicios', ingAusp, pct(ingAusp, ingTot), 'text-slate-600') : ''}
            ${fila('&nbsp;&nbsp;Ventas y aportes', ingOtros, pct(ingOtros, ingTot), 'text-slate-600')}</div>
          <div>${fila('− Egresos', egTot, pct(egTot, ingTot) + ' ing.', 'text-orange-600')}
            ${fila('= Saldo calculado', sCalc, '', 'text-slate-900')}
            ${fila('Saldo según cartola' + (hasta ? ' ' + hasta : ''), sBanco ?? 0, '', 'text-emerald-700', 'bg-emerald-50 px-1 rounded')}
            ${fila('+ Por cobrar a socios', porCobrar, pct(porCobrar, proyectado) + ' pot.', 'text-amber-600')}
            ${fila('= Saldo si todos pagan', proyectado, '', 'text-sky-700 font-bold')}</div>
        </div>
        ${fueraBanco.length ? `<p class="text-[10px] text-slate-500 mt-2">Fuera de la cuenta (no suman a la caja): ${fueraBanco.length} movimientos 2026 de Google Sheets (cuenta anterior o NO_EN_BANCO), neto ${fmt(fueraBanco.reduce((a, t) => a + neto(t), 0))}.</p>` : ''}
      </div>
    </div>`;
}
function nivelTras(barras, i) { const x = barras[i]; return x.tipo === 'baja' ? x.a : x.b; }

// Saldos de apertura al 31/12/2025: revisión y aprobación por la directiva
function viewAperturas() {
    const ap = (state.aperturas || []).map(a => ({ ...a, s: socioById(a.socio_id) })).filter(a => a.s);
    const conSaldo = ap.filter(a => Number(a.saldo) !== 0 || Number(a.saldo_calculado) !== 0 || a.observacion)
        .sort((a, b) => Number(a.saldo) - Number(b.saldo));
    const pend = ap.filter(a => !a.aprobado);
    const deuda = ap.filter(a => a.saldo < 0).reduce((t, a) => t - Number(a.saldo), 0);
    const favor = ap.filter(a => a.saldo > 0).reduce((t, a) => t + Number(a.saldo), 0);
    const sinSocio2025 = state.txs.filter(t => t.tipo === 'INGRESO' && t.subcategoria === 'CUOTA' && !t.socio_id && t.fecha < INICIO_CONTROL);
    const abierto = state.verAperturas ?? pend.length > 0;
    return `<div class="card mb-4 border-amber-200">
      <div class="p-3 bg-amber-50 rounded-t-xl flex flex-wrap items-center justify-between gap-2 cursor-pointer" onclick="setState({verAperturas:${!abierto}})">
        <div><h2 class="font-bold text-amber-900 text-sm">Saldos de apertura al 31/12/2025 ${abierto ? '▾' : '▸'}</h2>
          <p class="text-[11px] text-amber-800">${conSaldo.filter(a => a.saldo < 0).length} socios con deuda (${fmt(deuda)}) · ${conSaldo.filter(a => a.saldo > 0).length} a favor (${fmt(favor)}) ·
          <b>${pend.length ? `${pend.length} sin aprobar` : 'todos aprobados'}</b></p></div>
        ${sinSocio2025.length ? `<span class="text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded-lg">Antes de aprobar: ${sinSocio2025.length} cuotas 2025 sin socio (${fmt(sinSocio2025.reduce((a, t) => a + t.monto, 0))})</span>` : ''}
      </div>
      ${abierto ? `<div class="p-3">
        <p class="text-[11px] text-slate-600 mb-3">Propuesta calculada con la regla FIFO 2025. Corrige las cuotas 2025 sin socio en <b>Conciliación</b> y luego <b>Recalcular</b>. Puedes ajustar un saldo a mano antes de aprobar. Una vez aprobado queda congelado: cambios en datos 2025 ya no afectan 2026.</p>
        <div class="flex flex-wrap gap-2 mb-3 items-center">
          <button class="btn btn-g" onclick="recalcularAperturas()">Recalcular propuesta</button>
          <input class="inp w-56" placeholder="Referencia acta (ej. Acta 2026-11)" value="${esc(state.actaApertura)}" oninput="state.actaApertura=this.value">
          <button class="btn btn-o" ${pend.length ? '' : 'disabled'} onclick="aprobarAperturas()">Aprobar ${pend.length} pendientes</button>
        </div>
        <div class="scr overflow-auto" style="max-height:320px"><table class="w-full text-xs min-w-[640px]">
          <thead class="text-[10px] uppercase text-slate-400 border-b sticky top-0 bg-white"><tr><th class="py-1 text-left">Socio</th><th class="text-left">Estado</th><th class="text-right">Calculado</th><th class="text-right">Saldo apertura</th><th class="text-center">Aprobado</th></tr></thead>
          <tbody>${conSaldo.map(a => `<tr class="border-b border-slate-50">
            <td class="py-1.5 font-medium">${esc(a.s.nombre)}${a.observacion ? `<div class="text-[10px] text-sky-700 font-normal">📝 ${esc(a.observacion)}</div>` : ''}</td><td class="text-[10px]">${esc(a.s.estado)}</td>
            <td class="text-right mono text-slate-400">${fmt(a.saldo_calculado)}</td>
            <td class="text-right">${a.aprobado ? `<span class="mono font-bold ${a.saldo < 0 ? 'text-rose-600' : a.saldo > 0 ? 'text-emerald-700' : 'text-slate-500'}">${fmt(a.saldo)}</span>
                  <button class="ml-2 text-[10px] font-bold text-sky-700 hover:underline" onclick="abrirModal('apertura', ${a.socio_id})">Ajustar</button>`
                : `<input type="number" step="1" class="inp w-28 text-right mono" value="${a.saldo}" onchange="setSaldoApertura(${a.socio_id}, this.value)">`}</td>
            <td class="text-center text-[10px]">${a.aprobado ? `<span class="text-emerald-700 font-bold">✓ ${esc(a.acta || '')}</span>` : '<span class="text-amber-600 font-bold">pendiente</span>'}</td></tr>`).join('')
            || '<tr><td colspan="5" class="p-3 text-center text-slate-400">Sin saldos distintos de cero.</td></tr>'}</tbody></table></div>
      </div>` : ''}
    </div>`;
}
async function recalcularAperturas() {
    await withBusy('Recalculando saldos de apertura...', async () => {
        const { error } = await sb.rpc('recalcular_saldos_apertura'); if (error) throw error;
        await loadAll(); toast('Propuesta recalculada (los saldos aprobados no cambian).');
    });
}
async function setSaldoApertura(socioId, val) {
    const saldo = parseInt(val); if (isNaN(saldo)) return toast('Monto inválido', 'err');
    const { error } = await sb.from('saldos_apertura').update({ saldo, updated_at: new Date().toISOString() }).eq('socio_id', socioId).eq('aprobado', false);
    if (error) return toast(error.message, 'err');
    const a = state.aperturas.find(x => x.socio_id === socioId); if (a) a.saldo = saldo; render();
}
async function aprobarAperturas() {
    const acta = (state.actaApertura || '').trim();
    if (!acta) return toast('Indica la referencia del acta de directiva', 'err');
    if (!confirm(`¿Aprobar y congelar los saldos de apertura pendientes con "${acta}"?`)) return;
    await withBusy('Aprobando saldos de apertura...', async () => {
        const { error } = await sb.from('saldos_apertura').update({ aprobado: true, acta, aprobado_at: new Date().toISOString() }).eq('aprobado', false);
        if (error) throw error; await loadAll(); toast('Saldos de apertura aprobados y congelados.');
    });
}

}

function saldoBanco() {
    const origenCart = new Map(state.cartolas.map(c => [c.id, c.origen]));
    const mov = state.txs.filter(t => t.saldo != null && origenCart.get(t.cartola_id) === 'ARCHIVO')
        .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id - b.id);
    return mov[mov.length - 1] || null;
}
// Objetivo de las metas para el periodo: año completo o un mes (anual/12, mensual x1)
function objetivoMeta(m, porMes) { const v = Number(m.monto_objetivo); return porMes ? (m.periodicidad === 'MENSUAL' ? v : v / 12) : (m.periodicidad === 'MENSUAL' ? v * 12 : v); }
// "Llenado de vaso" de metas: lo recaudado cubre las metas en orden de prioridad
function cascadaMetas(metas, recaudado, porMes) {
    let resto = recaudado, acum = 0;
    return metas.map(m => {
        const objetivo = Math.round(objetivoMeta(m, porMes));
        const cubierto = Math.max(0, Math.min(objetivo, resto)); resto -= cubierto;
        const inicio = acum; acum += objetivo;
        const unidades = m.equivalencia_costo ? Math.floor(cubierto / Number(m.equivalencia_costo)) : null;
        return { ...m, objetivo, cubierto, falta: objetivo - cubierto, pct: objetivo ? cubierto / objetivo : 0, inicio, fin: acum, unidades };
    });
}
function svgDonut(parts, size = 150) {
    const total = parts.reduce((a, p) => a + p.v, 0); const r = 54, c = 2 * Math.PI * r; let off = 0;
    if (!total) return `<svg width="${size}" height="${size}" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="20"/><text x="75" y="80" text-anchor="middle" font-size="12" fill="#94a3b8">Sin datos</text></svg>`;
    const arcs = parts.filter(p => p.v > 0).map(p => { const len = c * p.v / total; const s = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(p.l)}: ${fmt(p.v)}</title></circle>`; off += len; return s; }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 150 150">${arcs}<text x="75" y="72" text-anchor="middle" font-size="10" fill="#64748b">Total</text><text x="75" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b">${fmtK(total)}</text></svg>`;
}
const fmtK = v => v >= 1e6 ? '$' + (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'K' : '$' + v;

async function guardarModal(ev) {
    ev.preventDefault();
    const f = new FormData(ev.target), v = k => (f.get(k) ?? '').toString().trim(), num = k => v(k) === '' ? null : parseInt(v(k));
    const md = state.modal; let tabla, rec;
    if (md.tipo === 'config') {
        const keys = ['banco', 'tipo_cuenta', 'numero_cuenta', 'titular', 'rut_titular', 'email_comprobante', 'plantilla_mensaje'];
        const upd = Object.fromEntries(keys.map(k => [k, (f.get(k) ?? '').toString()])); upd.updated_at = new Date().toISOString();
        return withBusy('Guardando...', async () => {
            const { error } = await sb.from('config_club').update(upd).eq('id', 1); if (error) throw error;
            state.modal = null; await loadAll(); toast('Datos de cobranza guardados');
        });
    }
    if (md.tipo === 'apertura') {
        const saldo = parseInt(v('saldo')), obs = v('observacion');
        if (isNaN(saldo) || !obs) return toast('Indica el saldo y el motivo del ajuste', 'err');
        const nota = `${obs} (ajuste ${new Date().toLocaleDateString('es-CL')}, ${state.me?.nombre || 'admin'})`;
        return withBusy('Guardando ajuste...', async () => {
            const { error } = await sb.from('saldos_apertura').update({ saldo, observacion: nota, updated_at: new Date().toISOString() }).eq('socio_id', md.id);
            if (error) throw error; state.modal = null; await loadAll(); toast('Saldo de apertura ajustado');
        });
    }
    if (md.tipo === 'meta') {
        tabla = 'metas';
        rec = { nombre: v('nombre'), descripcion: v('descripcion') || null, orden: num('orden') || 1, monto_objetivo: num('monto_objetivo'), periodicidad: v('periodicidad'),
                equivalencia_unidad: v('equivalencia_unidad') || null, equivalencia_costo: num('equivalencia_costo'), anio: num('anio'), activa: f.get('activa') === 'on' };
        if (!rec.nombre || !rec.monto_objetivo) return toast('Nombre y monto son obligatorios', 'err');
        if (rec.equivalencia_unidad && !rec.equivalencia_costo) return toast('Indica el costo por unidad de la equivalencia', 'err');
    } else {
        tabla = 'auspiciadores';
        rec = { nombre: v('nombre'), tipo: v('tipo'), nivel: v('nivel'), monto_comprometido: num('monto_comprometido') || 0, estado: v('estado'),
                fecha_inicio: v('fecha_inicio') || null, fecha_termino: v('fecha_termino') || null, alias_banco: v('alias_banco') || null,
                logo_url: v('logo_url') || null, sitio_url: v('sitio_url') || null, contacto: v('contacto') || null, visible_publico: f.get('visible_publico') === 'on' };
        if (!rec.nombre) return toast('El nombre es obligatorio', 'err');
    }
    await withBusy('Guardando...', async () => {
        const q = md.id ? sb.from(tabla).update(rec).eq('id', md.id) : sb.from(tabla).insert(rec);
        const { error } = await q; if (error) throw error;
        state.modal = null; await loadAll(); toast('Guardado');
    });
}
async function eliminarModal() {
    const md = state.modal; if (!md?.id || !confirm('¿Eliminar este registro?')) return;
    await withBusy('Eliminando...', async () => {

const MESES_LARGOS = MFULL;
function datosTransferencia(c) {
    return [`Banco: ${c.banco}`, `Tipo de cuenta: ${c.tipo_cuenta}`, `N° de cuenta: ${c.numero_cuenta}`, `Titular: ${c.titular}`, `RUT: ${c.rut_titular}`, `Email: ${c.email_comprobante}`].join('\n');

function detalleDeuda(s) {
    const meses = Object.entries(s.monthMap).filter(([, m]) => m.st === 'unpaid').map(([abs]) => {
        const a = parseInt(abs), y = Math.floor((a - 1) / 12), m = ((a - 1) % 12) + 1; return `${MESES_LARGOS[m - 1].toLowerCase()} ${y}`; });
    const d = []; if (s.saldoApertura < 0 && meses.length < s.impagos) d.push('saldo 2025');

function mensajeCobranza(s) {

    return String(c.plantilla_mensaje || '')
        .replaceAll('{nombre}', primerNombre).replaceAll('{nombre_completo}', s.nombre)
        .replaceAll('{meses}', String(s.impagos)).replaceAll('{detalle}', detalleDeuda(s))
        .replaceAll('{deuda}', fmt(s.deuda)).replaceAll('{cuota}', fmt(s.cuota_mensual ?? CUOTA_BASE))
        .replaceAll('{datos_transferencia}', datosTransferencia(c)).replaceAll('{email}', c.email_comprobante || '')

}

    if (state.loading) { root.innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="w-10 h-10 border-4 border-slate-200 rounded-full sp" style="border-top-color:var(--navy)"></div></div>`; return; }
    if (!state.session) { root.innerHTML = viewLogin(state.loginMsg); return; }
    if (state.definirClave) { root.innerHTML = viewDefinirClave(); return; }
    if (!state.me || !['admin','directiva'].includes(state.me.rol)) {
        root.innerHTML = viewLogin('Tu usuario no está vinculado a un socio con rol admin/directiva. Revisa el bootstrap del primer admin en schema.sql.');
        return;
    }
    const ro = soloLectura();
    if (ro && state.tab === 'cartola') state.tab = 'dashboard';
    const tabs = [['dashboard','Dashboard'], ['metas','Metas y Auspicios'], ['cartola','Subir cartola'], ['conciliacion','Conciliación'], ['estado','Estado de cuotas'], ['socios','Socios']]
        .filter(([k]) => !(ro && k === 'cartola'));
    const body = { dashboard: viewDashboard, metas: viewMetas, cartola: viewCartola, conciliacion: viewConciliacion, estado: viewEstado, socios: viewSocios }[state.tab]();
    root.innerHTML = `<div class="min-h-screen">
      <div class="sticky top-0 z-40" style="background:var(--navy)">
        <div class="max-w-[1700px] mx-auto px-3 sm:px-4 py-2 sm:py-2.5 flex flex-col lg:flex-row lg:items-center justify-between gap-2">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-black text-white text-sm" style="background:var(--orange)">SP</div>
            <div><h1 class="text-white font-extrabold text-sm leading-tight">Conciliación Bancaria</h1>
              <p class="text-slate-400 text-[9px] uppercase tracking-wider">CCSP · BancoEstado</p></div>
            <span class="lg:hidden ml-auto text-[9px] font-bold uppercase px-2 py-0.5 rounded-full ${ro ? 'bg-sky-500/20 text-sky-200' : 'bg-orange-500/20 text-orange-200'}">${ro ? 'Directiva' : 'Tesorería'}</span>
            <button onclick="doLogout()" class="lg:hidden text-slate-300 hover:text-white text-[11px] font-bold px-2 py-1">Salir</button>
          </div>
          <div class="flex items-center gap-1 overflow-x-auto scr whitespace-nowrap -mx-3 px-3 lg:mx-0 lg:px-0 pb-1 lg:pb-0">
            ${tabs.map(([k,l]) => `<button onclick="setState({tab:'${k}'});window.scrollTo(0,0)" class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold ${state.tab === k ? 'bg-white text-slate-800' : 'text-slate-300 hover:text-white'}">${l}</button>`).join('')}
            <span class="hidden lg:inline text-slate-400 text-[10px] ml-3">${esc(state.me.nombre)}</span>
            <span class="hidden lg:inline text-[9px] font-bold uppercase tracking-wider ml-2 px-2 py-0.5 rounded-full ${ro ? 'bg-sky-500/20 text-sky-200' : 'bg-orange-500/20 text-orange-200'}">${ro ? 'Directiva · consulta' : 'Tesorería · admin'}</span>
            <a href="publico.html" target="_blank" class="hidden lg:inline text-slate-400 hover:text-white text-[10px] font-bold ml-3">Vista socios ↗</a>
            <button onclick="doLogout()" class="hidden lg:inline text-slate-300 hover:text-white text-[10px] font-bold ml-2">Salir</button>
          </div>
        </div>
      </div>
      ${ro ? `<div class="bg-sky-50 border-b border-sky-200 text-sky-800 text-[11px] font-bold text-center px-3 py-1.5">👁 Modo consulta · los cambios los registra solo tesorería</div>` : ''}
      <div class="max-w-[1700px] mx-auto px-2 sm:px-4 py-4">${body}</div>
      ${viewModal()}
      ${state.busy ? `<div class="fixed inset-0 bg-slate-900/30 z-50 flex items-center justify-center"><div class="card px-5 py-4 flex items-center gap-3">
        <div class="w-5 h-5 border-2 border-slate-200 rounded-full sp" style="border-top-color:var(--navy)"></div><span class="text-sm font-medium text-slate-700">${esc(state.busy)}</span></div></div>` : ''}
    </div>`;
    if (ro) aplicarSoloLectura(root);
}

// ============================================================
// MODO CONSULTA (rol directiva). La protección real es RLS (v5);
// esto solo oculta los controles que escribirían.
// ============================================================
const ACCIONES_ESCRITURA = /abrirModal|enviarRecordatorio|import\w+Sheet|importSheetTxs|delRow|rematchSinAsignar|recalcularAperturas|eliminarModal|guardarModal|confirmarTx|commitPreview|aprobarAperturas|editSocio|saveSocio|addNovedad|addAlias|setSocio|setSubcat|setAuspiciador|setSaldoApertura|onFileSelected|regenerarLink/;
function soloLectura() { return state.me?.rol !== 'admin'; }
function aplicarSoloLectura(root) {
    root.querySelectorAll('[onclick],[onchange],[onsubmit]').forEach(el => {
        const h = (el.getAttribute('onclick') || '') + (el.getAttribute('onchange') || '') + (el.getAttribute('onsubmit') || '');
        if (!ACCIONES_ESCRITURA.test(h)) return;
        if (el.tagName === 'SELECT' || el.tagName === 'INPUT') { el.disabled = true; el.classList.add('opacity-60'); }
        else el.style.display = 'none';
    });
}
// Bloqueo adicional en JS: si alguien llama una acción desde la consola
['enviarRecordatorio','importSheetTxs','importSociosSheet','importNovedadesSheet','delRow','rematchSinAsignar','recalcularAperturas',
 'eliminarModal','guardarModal','confirmarTx','commitPreview','aprobarAperturas','saveSocio','addNovedad','addAlias',
 'setSocio','setSubcat','setAuspiciador','setSaldoApertura','regenerarLink'].forEach(n => {
    const f = window[n]; if (typeof f !== 'function') return;
    window[n] = function (...a) { if (soloLectura()) { toast('Modo consulta: solo tesorería puede modificar datos.', 'warn'); a[0]?.preventDefault?.(); return; } return f.apply(this, a); };
});

function setState(patch) { Object.assign(state, patch); render(); }
function setCf(k, v) { state.cf[k] = v; if (k !== 'page') state.cf.page = 0; else state.cf.page = parseInt(v); render(); }

// ============================================================
// AUTENTICACIÓN
// ============================================================
async function doLogin(ev) {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    if (error) { state.loginMsg = error.message; render(); }
}
async function doLogout() { await sb.auth.signOut(); }

async function onSession(session) {
    state.session = session; state.me = null; state.loginMsg = '';
    if (session) {
        state.loading = true; render();
        try {
            const { data } = await sb.from('socios').select('*').eq('auth_user_id', session.user.id).maybeSingle();
            state.me = data;
            if (data && ['admin','directiva'].includes(data.rol)) await loadAll();
        } catch (e) { toast(`Error cargando datos: ${e.message}`, 'err'); }
    }
    state.loading = false; render();
}

async function init() {
    if (!CONFIG_OK) { state.loading = false; render(); return; }
    const { data } = await sb.auth.getSession();
    if (data.session && (TIPO_LINK === 'invite' || TIPO_LINK === 'recovery')) state.definirClave = true;
    await onSession(data.session);
    sb.auth.onAuthStateChange((ev, session) => {
        if (ev === 'PASSWORD_RECOVERY') { state.session = session; state.definirClave = true; render(); return; }
        // Evita recargas cuando Supabase re-emite SIGNED_IN para el mismo usuario (refresh de token / foco)
        if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && session?.user?.id !== state.session?.user?.id)) onSession(session);
    });
}
init();
</script>
</body>
